# ansible/host_vars/splunk.yml
hawser_openbao_path: "secret/splunk"
docker_data_mount: /opt/splunk-data

app_storage:
  - path: "{{ docker_data_mount }}/splunk-data"
    owner: "41812"
    group: "41812"
    mode: "0755"

  - path: "{{ docker_data_mount }}/splunk-apps"
    owner: "41812"
    group: "41812"
    mode: "0755"