[pihole_hosts]
pihole ansible_host=192.168.1.104

[splunk_hosts]
splunk ansible_host=192.168.1.102

[ai_hosts]
ai ansible_host=192.168.1.105

[docker_hosts]
docker-main ansible_host=192.168.1.106

# All LXC hosts where Docker should be installed/managed
[docker_hosts:children]
pihole_hosts
ai_hosts
docker_hosts
splunk_hosts

[all:vars]
# Ansible connects to the root user of managed LXC containers
ansible_user=root
ansible_ssh_private_key_file=/home/ansible/.ssh/id_ed25519_homelab