# ansible/inventory/hosts.ini

[all]
openbao ansible_host=192.168.1.101
splunk ansible_host=192.168.1.102
immich ansible_host=192.168.1.103
pihole ansible_host=192.168.1.104
ai ansible_host=192.168.1.105
dockership ansible_host=192.168.1.106
iptv ansible_host=192.168.1.107
observability ansible_host=192.168.1.108
nextcloud ansible_host=192.168.1.109
controller ansible_host=192.168.1.110
lakehouse ansible_host=192.168.1.111



# -------------------------------------------------------------------
# Docker hosts
# -------------------------------------------------------------------
# All LXC containers running Docker.
#
# dockership is the central Docker host running Dockhand.
# -------------------------------------------------------------------

[docker_hosts]
splunk
immich
pihole
ai
dockership
iptv
observability
openbao
nextcloud
lakehouse


# -------------------------------------------------------------------
# Hawser agents
# -------------------------------------------------------------------
# Hawser runs on Docker hosts managed by the central Dockhand server.
#
# dockership is intentionally excluded because it runs the
# Dockhand server itself.
# -------------------------------------------------------------------

[hawser_hosts]
splunk
immich
pihole
ai
iptv
observability
openbao
nextcloud
lakehouse

# -------------------------------------------------------------------
# OpenBao
# -------------------------------------------------------------------

[openbao]
openbao

[openbao_agents]
# Add one line per LXC that needs an AppRole + bao agent, e.g.:
splunk
immich
pihole
ai
dockership
iptv
observability
nextcloud
lakehouse


# -------------------------------------------------------------------
# Controller
# -------------------------------------------------------------------

[controller]
controller


# -------------------------------------------------------------------
# Ansible connection defaults
# -------------------------------------------------------------------
# All LXC targets use root.
# The controller itself is also currently represented here, but
# controller-specific playbooks can override this if required.
# -------------------------------------------------------------------

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=/home/ansible/.ssh/id_ed25519_homelab