[pihole_hosts]
pihole ansible_host=192.168.1.104

[splunk_hosts]
splunk ansible_host=192.168.1.102

[ai_hosts]
ai ansible_host=192.168.1.105

[openbao_hosts]
openbao ansible_host=192.168.1.101

#This contains all the misc docker containers that are not part of the other groups. 
[dockership_hosts]
dockership ansible_host=192.168.1.106

[docker_hosts:children]
pihole_hosts
ai_hosts
dockership_hosts
openbao_hosts
splunk_hosts

#All LXC apart from controller will use root user and the same ssh key for ansible.
[all:vars]
ansible_user=root
ansible_ssh_private_key_file=/home/ansible/.ssh/id_ed25519_homelab