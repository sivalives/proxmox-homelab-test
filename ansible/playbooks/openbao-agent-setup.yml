---
# Install the bao CLI + bao-agent + AppRole credentials on a new LXC,
# for a stack that's already been bootstrapped on the OpenBao server
# (i.e. it's in group_vars/all.yml's openbao_app_stacks, or you ran
# 02-add-app.yml for it) - so its role-id/secret-id already exist
# under stacks/openbao/bootstrap/<stack>/ on this controller.
#
# Run:
#   ansible-playbook playbooks/03-deploy-agent.yml -l <lxc-host-in-inventory>

- name: Deploy OpenBao agent to an LXC
  #hosts: openbao_agents
  hosts: "{{ stack_name }}"
  become: true
  gather_facts: false

  vars:
    controller_bootstrap_dir: "{{ playbook_dir }}/../.bootstrap"

  pre_tasks:
    - name: Load this stack's AppRole credentials from the controller
      ansible.builtin.set_fact:
        openbao_role_id: "{{ lookup('file', controller_bootstrap_dir + '/' + stack_name + '/role-id') }}"
        openbao_secret_id: "{{ lookup('file', controller_bootstrap_dir + '/' + stack_name + '/secret-id') }}"
        openbao_stack: "{{ stack_name }}"
      no_log: true

  roles:
    - openbao_agent
