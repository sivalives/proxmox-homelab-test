---
- name: Bootstrap OpenBao application
  hosts: openbao
  become: true
  gather_facts: false

  vars_prompt:

    - name: app_name
      prompt: "Application name (e.g. dockership, ai, splunk)"
      private: false

    - name: include_shared_policy
      prompt: "Give this application read access to shared secrets? (yes/no)"
      private: false
      default: "yes"

    - name: app_secrets_input
      prompt: "Enter app secrets as KEY=VALUE pairs separated by commas (leave empty for none)"
      private: true
      default: ""

    - name: openbao_admin_token
      prompt: "Enter OpenBao root/admin token"
      private: true

  vars:

    # ------------------------------------------------------------
    # OpenBao
    # ------------------------------------------------------------

    openbao_container: "openbao"
    openbao_addr: "http://127.0.0.1:8200"
    bao_cmd: "/usr/local/bin/bao"

    kv_mount: "secret"

    # ------------------------------------------------------------
    # AppRole configuration
    # ------------------------------------------------------------

    approle_token_ttl: "1h"
    approle_token_max_ttl: "4h"

    # 0 = does not expire
    secret_id_ttl: "0"

    # 0 = unlimited uses
    secret_id_num_uses: "0"

    # ------------------------------------------------------------
    # Controller bootstrap credentials
    # ------------------------------------------------------------

    controller_bootstrap_dir: "/opt/homelab/stacks/openbao/bootstrap"

    # Temporary policy file on OpenBao host
    app_policy_file: "/tmp/{{ app_name }}-policy.hcl"


  pre_tasks:

    # ============================================================
    # Validate application name
    # ============================================================

    - name: Validate application name
      ansible.builtin.assert:
        that:
          - app_name is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: >
          Invalid application name.
          Use lowercase letters, numbers and hyphens only.

    # ============================================================
    # Validate shared policy option
    # ============================================================

    - name: Validate shared policy option
      ansible.builtin.assert:
        that:
          - include_shared_policy | lower in ['yes', 'no', 'true', 'false']
        fail_msg: "include_shared_policy must be yes or no."

    # ============================================================
    # Check OpenBao container
    # ============================================================

    - name: Check OpenBao container exists
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "{{ openbao_container }}"
      register: openbao_container_check
      changed_when: false
      failed_when: false

    - name: Fail if OpenBao container does not exist
      ansible.builtin.assert:
        that:
          - openbao_container_check.rc == 0
        fail_msg: >
          OpenBao Docker container '{{ openbao_container }}'
          does not exist.

    # ============================================================
    # Check OpenBao container running
    # ============================================================

    - name: Check OpenBao container is running
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - -f
          - "{{ '{{.State.Running}}' }}"
          - "{{ openbao_container }}"
      register: openbao_running
      changed_when: false

    - name: Fail if OpenBao container is not running
      ansible.builtin.assert:
        that:
          - openbao_running.stdout == "true"
        fail_msg: "OpenBao container is not running."

    # ============================================================
    # OpenBao status
    # ============================================================

    - name: Check OpenBao status
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ openbao_container }}"
          - "{{ bao_cmd }}"
          - status
          - -format=json
      environment:
        BAO_ADDR: "{{ openbao_addr }}"
      register: openbao_status
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail if OpenBao status cannot be read
      ansible.builtin.assert:
        that:
          - openbao_status.rc == 0
        fail_msg: >
          Unable to query OpenBao status.
          Check that OpenBao is running and the CLI path is correct.

    - name: Parse OpenBao status
      ansible.builtin.set_fact:
        bao_status: "{{ openbao_status.stdout | from_json }}"
      no_log: true

    # ============================================================
    # Validate initialized / unsealed
    # ============================================================

    - name: Validate OpenBao initialized
      ansible.builtin.assert:
        that:
          - bao_status.initialized | bool
        fail_msg: >
          OpenBao is not initialized.
          Run the initial OpenBao bootstrap first.

    - name: Validate OpenBao unsealed
      ansible.builtin.assert:
        that:
          - not (bao_status.sealed | bool)
        fail_msg: >
          OpenBao is sealed.
          Unseal OpenBao before running this playbook.

    # ============================================================
    # Validate Raft
    # ============================================================

    - name: Validate OpenBao uses Raft
      ansible.builtin.assert:
        that:
          - bao_status.storage_type | lower