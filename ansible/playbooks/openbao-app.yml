---
- name: Bootstrap OpenBao application
  hosts: openbao
  become: true
  gather_facts: false

  vars:
    openbao_container: "openbao"
    openbao_addr: "http://127.0.0.1:8200"
    bao_cmd: "/usr/bin/bao"
    kv_mount: "secret"
    approle_token_ttl: "1h"
    approle_token_max_ttl: "4h"
    secret_id_ttl: "0"
    secret_id_num_uses: "0"
    controller_bootstrap_dir: "{{ playbook_dir }}/../../stacks/openbao/bootstrap"

  vars_prompt:
    - name: app_name
      prompt: "Enter application name"
      private: false
    - name: openbao_admin_token
      prompt: "Enter OpenBao admin/root token"
      private: true
    - name: include_shared_policy
      prompt: "Include shared secrets access? (yes/no)"
      private: false
      default: "yes"
    - name: app_secrets_input
      prompt: "Application secrets (KEY=VALUE,KEY2=VALUE2) or leave empty"
      private: true
      default: ""
    - name: force_regenerate
      prompt: "Force regenerate AppRole credentials? (yes/no)"
      private: false
      default: "no"

  pre_tasks:
    # Validation
    - name: Validate inputs
      assert:
        that:
          - app_name is match('^[a-zA-Z0-9][a-zA-Z0-9_-]*$')
          - include_shared_policy | lower in ['yes', 'no', 'true', 'false']
        fail_msg: "Invalid app_name or shared policy option"

    - name: Set flags
      set_fact:
        include_shared: "{{ include_shared_policy | lower in ['yes', 'true'] }}"
        do_force_regenerate: "{{ force_regenerate | lower in ['yes', 'true'] }}"

  tasks:
    # Pre-checks
    - name: Check OpenBao container running
      command:
        argv:
          - docker
          - inspect
          - -f
          - "{{ '{{.State.Running}}' }}"
          - "{{ openbao_container }}"
      register: container_status
      changed_when: false
      failed_when: container_status.rc != 0 or container_status.stdout | trim != "true"

    - name: Check OpenBao initialized and unsealed
      command:
        argv: [docker, exec, -e, "BAO_ADDR={{ openbao_addr }}", -e, "BAO_TOKEN={{ openbao_admin_token }}", "{{ openbao_container }}", "{{ bao_cmd }}", status, -format=json]
      register: bao_status
      changed_when: false
      no_log: true
      failed_when:
        - bao_status.rc != 0
        - (bao_status.stdout | from_json).initialized | default(false) | not
        - (bao_status.stdout | from_json).sealed | default(true)

    # Parse secrets
    - name: Parse application secrets
      set_fact:
        app_secret_data: "{{ app_secret_data | default({}) | combine({item.split('=', 1)[0]: item.split('=', 1)[1]}) }}"
      loop: "{{ app_secrets_input.split(',') | map('trim') | reject('equalto', '') | list }}"
      when: app_secrets_input | trim
      no_log: true

    # Check existing secret
    - name: Check if app secret exists
      command:
        argv: [docker, exec, -e, "BAO_ADDR={{ openbao_addr }}", -e, "BAO_TOKEN={{ openbao_admin_token }}", "{{ openbao_container }}", "{{ bao_cmd }}", kv, get, "{{ kv_mount }}/{{ app_name }}"]
      register: existing_secret
      changed_when: false
      failed_when: false
      no_log: true

    # Create or patch secret
    - name: Create application secret
      shell: |
        docker exec \
          -e BAO_ADDR="{{ openbao_addr }}" \
          -e BAO_TOKEN="{{ openbao_admin_token }}" \
          "{{ openbao_container }}" \
          "{{ bao_cmd }}" kv put "{{ kv_mount }}/{{ app_name }}" \
          {% for key, value in (app_secret_data | default({}) | dictsort) %}
          {{ key }}="{{ value }}" \
          {% endfor %}
      when:
        - existing_secret.rc != 0
        - app_secret_data | default({}) | length > 0
      changed_when: true
      no_log: true

    - name: Patch existing secret
      shell: |
        docker exec \
          -e BAO_ADDR="{{ openbao_addr }}" \
          -e BAO_TOKEN="{{ openbao_admin_token }}" \
          "{{ openbao_container }}" \
          "{{ bao_cmd }}" kv patch "{{ kv_mount }}/{{ app_name }}" \
          {% for key, value in (app_secret_data | default({}) | dictsort) %}
          {{ key }}="{{ value }}" \
          {% endfor %}
      when:
        - existing_secret.rc == 0
        - app_secret_data | default({}) | length > 0
      changed_when: true
      no_log: true

    # Policy
    - name: Create application policy
      command:
        argv: [docker, exec, -i, -e, "BAO_ADDR={{ openbao_addr }}", -e, "BAO_TOKEN={{ openbao_admin_token }}", "{{ openbao_container }}", "{{ bao_cmd }}", policy, write, "{{ app_name }}-policy", "-"]
      args:
        stdin: |
          # Managed by Ansible - {{ app_name }}
          path "{{ kv_mount }}/data/{{ app_name }}" {
            capabilities = ["read"]
          }
          path "{{ kv_mount }}/data/{{ app_name }}/*" {
            capabilities = ["read"]
          }
          path "{{ kv_mount }}/metadata/{{ app_name }}" {
            capabilities = ["read", "list"]
          }
          path "{{ kv_mount }}/metadata/{{ app_name }}/*" {
            capabilities = ["read", "list"]
          }
          {% if include_shared %}
          path "{{ kv_mount }}/data/shared" {
            capabilities = ["read"]
          }
          path "{{ kv_mount }}/data/shared/*" {
            capabilities = ["read"]
          }
          path "{{ kv_mount }}/metadata/shared" {
            capabilities = ["read", "list"]
          }
          path "{{ kv_mount }}/metadata/shared/*" {
            capabilities = ["read", "list"]
          }
          {% endif %}
      changed_when: true
      no_log: true

    # AppRole management
    - name: Enable AppRole auth method
      command:
        argv: [docker, exec, -e, "BAO_ADDR={{ openbao_addr }}", -e, "BAO_TOKEN={{ openbao_admin_token }}", "{{ openbao_container }}", "{{ bao_cmd }}", auth, enable, approle]
      register: enable_approle
      changed_when: true
      failed_when:
        - enable_approle.rc != 0
        - "'path already in use' not in enable_approle.stderr"
      no_log: true

    - name: Force delete AppRole if regenerating
      command:
        argv: [docker, exec, -e, "BAO_ADDR={{ openbao_addr }}", -e, "BAO_TOKEN={{ openbao_admin_token }}", "{{ openbao_container }}", "{{ bao_cmd }}", delete, "auth/approle/role/{{ app_name }}"]
      when: do_force_regenerate
      changed_when: true
      failed_when: false
      no_log: true

    - name: Create or update AppRole
      command:
        argv:
          - docker
          - exec
          - -e
          - "BAO_ADDR={{ openbao_addr }}"
          - -e
          - "BAO_TOKEN={{ openbao_admin_token }}"
          - "{{ openbao_container }}"
          - "{{ bao_cmd }}"
          - write
          - "auth/approle/role/{{ app_name }}"
          - "token_policies={{ app_name }}-policy"
          - "token_ttl={{ approle_token_ttl }}"
          - "token_max_ttl={{ approle_token_max_ttl }}"
          - "secret_id_ttl={{ secret_id_ttl }}"
          - "secret_id_num_uses={{ secret_id_num_uses }}"
      changed_when: true
      no_log: true

    # Retrieve credentials
    - name: Get AppRole Role ID
      command:
        argv: [docker, exec, -e, "BAO_ADDR={{ openbao_addr }}", -e, "BAO_TOKEN={{ openbao_admin_token }}", "{{ openbao_container }}", "{{ bao_cmd }}", read, -field=role_id, "auth/approle/role/{{ app_name }}/role-id"]
      register: role_id
      changed_when: false
      failed_when: role_id.rc != 0
      no_log: true

    - name: Generate AppRole Secret ID
      command:
        argv: [docker, exec, -e, "BAO_ADDR={{ openbao_addr }}", -e, "BAO_TOKEN={{ openbao_admin_token }}", "{{ openbao_container }}", "{{ bao_cmd }}", write, -field=secret_id, "auth/approle/role/{{ app_name }}/secret-id"]
      register: secret_id
      changed_when: true
      failed_when: secret_id.rc != 0
      no_log: true

    # Stage credentials
    - name: Create bootstrap directory
      file:
        path: "{{ controller_bootstrap_dir }}/{{ app_name }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Stage Role ID
      copy:
        content: "{{ role_id.stdout | trim }}\n"
        dest: "{{ controller_bootstrap_dir }}/{{ app_name }}/role-id"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Stage Secret ID
      copy:
        content: "{{ secret_id.stdout | trim }}\n"
        dest: "{{ controller_bootstrap_dir }}/{{ app_name }}/secret-id"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Bootstrap summary
      debug:
        msg:
          - "✓ Application: {{ app_name }}"
          - "✓ Secret: {{ kv_mount }}/{{ app_name }}"
          - "✓ Policy: {{ app_name }}-policy"
          - "✓ AppRole credentials staged"
          - "✓ Shared secrets: {{ include_shared }}"
          - ""
          - "Role ID: {{ controller_bootstrap_dir }}/{{ app_name }}/role-id"
          - "Secret ID: {{ controller_bootstrap_dir }}/{{ app_name }}/secret-id"