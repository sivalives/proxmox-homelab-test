---
- name: Configure Tailscale on Pi-hole
  hosts: pihole
  become: true
  gather_facts: true

  vars:
    openbao_addr: "http://192.168.1.101:8200"
    openbao_kv_mount: "secret"
    openbao_kv_path: "pihole"
    openbao_role_id_file: "/var/lib/openbao/role-id"
    openbao_secret_id_file: "/var/lib/openbao/secret-id"
    tailscale_routes: "192.168.1.0/24"

  pre_tasks:

    - name: Check OpenBao Role ID file
      ansible.builtin.stat:
        path: "{{ openbao_role_id_file }}"
      register: openbao_role_id_stat

    - name: Check OpenBao Secret ID file
      ansible.builtin.stat:
        path: "{{ openbao_secret_id_file }}"
      register: openbao_secret_id_stat

    - name: Validate OpenBao credential files
      ansible.builtin.assert:
        that:
          - openbao_role_id_stat.stat.exists
          - openbao_secret_id_stat.stat.exists
          - openbao_role_id_stat.stat.isreg
          - openbao_secret_id_stat.stat.isreg
        fail_msg: "OpenBao credential files are missing."

    - name: Read OpenBao Role ID
      ansible.builtin.slurp:
        src: "{{ openbao_role_id_file }}"
      register: openbao_role_id_raw
      no_log: true

    - name: Read OpenBao Secret ID
      ansible.builtin.slurp:
        src: "{{ openbao_secret_id_file }}"
      register: openbao_secret_id_raw
      no_log: true

    - name: Extract OpenBao credentials
      ansible.builtin.set_fact:
        openbao_role_id: "{{ openbao_role_id_raw.content | b64decode | trim }}"
        openbao_secret_id: "{{ openbao_secret_id_raw.content | b64decode | trim }}"
      no_log: true

    - name: Validate OpenBao credentials
      ansible.builtin.assert:
        that:
          - openbao_role_id | length > 0
          - openbao_secret_id | length > 0
        fail_msg: "OpenBao Role ID or Secret ID is empty."
      no_log: true

    - name: Check OpenBao CLI
      ansible.builtin.command:
        cmd: /usr/local/bin/bao version
      register: bao_version
      changed_when: false

    - name: Display OpenBao CLI version
      ansible.builtin.debug:
        msg: "{{ bao_version.stdout }}"

    - name: Authenticate to OpenBao using AppRole
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/bao write
          -format=json
          auth/approle/login
          role_id={{ openbao_role_id }}
          secret_id={{ openbao_secret_id }}
      register: bao_login
      changed_when: false
      no_log: true
      environment:
        BAO_ADDR: "{{ openbao_addr }}"

    - name: Extract OpenBao token
      ansible.builtin.set_fact:
        openbao_token: "{{ (bao_login.stdout | from_json).auth.client_token }}"
      no_log: true

    - name: Read Pi-hole secret from OpenBao
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/bao kv get
          -format=json
          -mount={{ openbao_kv_mount }}
          {{ openbao_kv_path }}
      register: pihole_secret
      changed_when: false
      no_log: true
      environment:
        BAO_ADDR: "{{ openbao_addr }}"
        BAO_TOKEN: "{{ openbao_token }}"

    - name: Extract Tailscale auth key
      ansible.builtin.set_fact:
        tailscale_authkey: "{{ (pihole_secret.stdout | from_json).data.data.TAILSCALE_AUTHKEY }}"
      no_log: true

    - name: Validate Tailscale auth key
      ansible.builtin.assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
          - tailscale_authkey != "CHANGE_ME_TAILSCALE_AUTHKEY"
        fail_msg: "TAILSCALE_AUTHKEY is missing or still contains the placeholder."
      no_log: true

    - name: Install Tailscale prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install Tailscale signing key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Configure Tailscale repository
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Configure IP forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-tailscale.conf
        mode: "0644"
        content: |
          net.ipv4.ip_forward=1
          net.ipv6.conf.all.forwarding=1

    - name: Apply IP forwarding configuration
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Wait for tailscaled socket
      ansible.builtin.wait_for:
        path: /var/run/tailscale/tailscaled.sock
        state: present
        timeout: 30

    - name: Verify tailscaled service
      ansible.builtin.systemd:
        name: tailscaled
      register: tailscaled_service
      changed_when: false

    - name: Validate tailscaled is running
      ansible.builtin.assert:
        that:
          - tailscaled_service.status.ActiveState == "active"
          - tailscaled_service.status.SubState == "running"
        fail_msg: "tailscaled is not running."

    - name: Configure Tailscale
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--auth-key={{ tailscale_authkey }}"
          - "--hostname={{ ansible_hostname }}"
          - "--accept-dns"
          - "--advertise-routes={{ tailscale_routes }}"
          - "--ssh=false"
          - "--reset"
      register: tailscale_up
      changed_when: true
      no_log: true

    - name: Get Tailscale status
      ansible.builtin.command:
        cmd: tailscale status
      register: tailscale_status
      changed_when: false

    - name: Display Tailscale status
      ansible.builtin.debug:
        var: tailscale_status.stdout

    - name: Clear sensitive variables
      ansible.builtin.set_fact:
        openbao_role_id: ""
        openbao_secret_id: ""
        openbao_token: ""
        tailscale_authkey: ""
      no_log: true