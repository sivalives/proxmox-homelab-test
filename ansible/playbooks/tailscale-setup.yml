---
- name: Configure Tailscale subnet router on Pi-hole
  hosts: pihole
  become: true
  gather_facts: true

  vars:
    # OpenBao
    openbao_addr: "http://192.168.1.106:8200"
    openbao_kv_mount: "secret"
    openbao_secret_path: "homelab/tailscale"

    # Tailscale
    tailscale_routes: "192.168.1.0/24"

  pre_tasks:

    # ─────────────────────────────────────────────────────────────
    # GET OPENBAO APPROLE CREDENTIALS
    # ─────────────────────────────────────────────────────────────
    #
    # These should already have been staged on the controller
    # by your bootstrap process.
    #
    # Example:
    # /opt/homelab/secrets/pihole/openbao_role_id
    # /opt/homelab/secrets/pihole/openbao_secret_id
    #
    # ─────────────────────────────────────────────────────────────

    - name: Read OpenBao Role ID from controller
      ansible.builtin.slurp:
        src: /opt/homelab/secrets/pihole/openbao_role_id
      delegate_to: localhost
      register: openbao_role_id_file
      no_log: true

    - name: Read OpenBao Secret ID from controller
      ansible.builtin.slurp:
        src: /opt/homelab/secrets/pihole/openbao_secret_id
      delegate_to: localhost
      register: openbao_secret_id_file
      no_log: true

    - name: Set OpenBao AppRole credentials
      ansible.builtin.set_fact:
        openbao_role_id: "{{ openbao_role_id_file.content | b64decode | trim }}"
        openbao_secret_id: "{{ openbao_secret_id_file.content | b64decode | trim }}"
      no_log: true

    # ─────────────────────────────────────────────────────────────
    # GET TAILSCALE AUTH KEY FROM OPENBAO
    # ─────────────────────────────────────────────────────────────

    - name: Read Tailscale secret from OpenBao
      community.hashi_vault.hashi_vault:
        url: "{{ openbao_addr }}"
        engine_mount_point: "{{ openbao_kv_mount }}"
        path: "{{ openbao_secret_path }}"
        auth_method: approle
        role_id: "{{ openbao_role_id }}"
        secret_id: "{{ openbao_secret_id }}"
      delegate_to: localhost
      register: tailscale_openbao_secret
      no_log: true

    - name: Extract Tailscale auth key
      ansible.builtin.set_fact:
        tailscale_authkey: "{{ tailscale_openbao_secret.secret.authkey }}"
      no_log: true

    - name: Verify Tailscale auth key was retrieved
      ansible.builtin.assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
        fail_msg: "Tailscale auth key was not found in OpenBao."
      no_log: true

  tasks:

    # ─────────────────────────────────────────────────────────────
    # INSTALL TAILSCALE
    # ─────────────────────────────────────────────────────────────

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install Tailscale signing key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Configure Tailscale repository
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    # ─────────────────────────────────────────────────────────────
    # ENABLE TAILSCALED
    # ─────────────────────────────────────────────────────────────

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    # ─────────────────────────────────────────────────────────────
    # ENABLE IP FORWARDING
    # ─────────────────────────────────────────────────────────────

    - name: Configure IP forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-tailscale.conf
        mode: "0644"
        content: |
          net.ipv4.ip_forward=1
          net.ipv6.conf.all.forwarding=1
      notify: Apply sysctl

    # ─────────────────────────────────────────────────────────────
    # CONFIGURE TAILSCALE
    # ─────────────────────────────────────────────────────────────

    - name: Check current Tailscale state
      ansible.builtin.command:
        cmd: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false
      no_log: true

    - name: Connect/configure Tailscale
      ansible.builtin.command:
        cmd: >
          tailscale up
          --auth-key={{ tailscale_authkey }}
          --hostname={{ ansible_hostname }}
          --accept-dns
          --advertise-routes={{ tailscale_routes }}
          --ssh=false
          --reset
      register: tailscale_up
      no_log: true
      changed_when: true

    # ─────────────────────────────────────────────────────────────
    # VERIFY
    # ─────────────────────────────────────────────────────────────

    - name: Get final Tailscale status
      ansible.builtin.command:
        cmd: tailscale status
      register: tailscale_final_status
      changed_when: false

    - name: Display Tailscale status
      ansible.builtin.debug:
        var: tailscale_final_status.stdout

  handlers:

    - name: Apply sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true