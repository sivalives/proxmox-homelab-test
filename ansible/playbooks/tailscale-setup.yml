---
- name: Configure Tailscale on Pi-hole
  hosts: pihole
  become: true
  gather_facts: true

  vars:
    openbao_addr: "http://192.168.1.106:8200"
    openbao_kv_path: "secret/pihole"

    tailscale_routes: "192.168.1.0/24"

  pre_tasks:

    # ============================================================
    # VALIDATE OPENBAO CREDENTIALS
    # ============================================================

    - name: Validate OpenBao AppRole credentials
      ansible.builtin.assert:
        that:
          - openbao_role_id is defined
          - openbao_role_id | length > 0
          - openbao_secret_id is defined
          - openbao_secret_id | length > 0
        fail_msg: >
          OpenBao AppRole credentials were not supplied.
          Expected openbao_role_id and openbao_secret_id.
      no_log: true

    # ============================================================
    # CHECK OPENBAO CLI ON CONTROLLER
    # ============================================================

    - name: Check OpenBao CLI on controller
      ansible.builtin.command:
        cmd: bao version
      delegate_to: localhost
      register: bao_version
      changed_when: false

    - name: Display OpenBao CLI version
      ansible.builtin.debug:
        msg: "{{ bao_version.stdout }}"

    # ============================================================
    # AUTHENTICATE TO OPENBAO
    # ============================================================

    - name: Authenticate to OpenBao using AppRole
      ansible.builtin.command:
        cmd: >
          bao write -format=json
          auth/approle/login
          role_id={{ openbao_role_id }}
          secret_id={{ openbao_secret_id }}
      delegate_to: localhost
      register: bao_login
      changed_when: false
      no_log: true
      environment:
        BAO_ADDR: "{{ openbao_addr }}"

    - name: Extract OpenBao token
      ansible.builtin.set_fact:
        openbao_token: "{{ (bao_login.stdout | from_json).auth.client_token }}"
      no_log: true

    # ============================================================
    # READ TAILSCALE SECRET
    # ============================================================

    - name: Read Pi-hole secret from OpenBao
      ansible.builtin.command:
        cmd: >
          bao kv get
          -format=json
          -mount=secret
          pihole
      delegate_to: localhost
      register: pihole_secret
      changed_when: false
      no_log: true
      environment:
        BAO_ADDR: "{{ openbao_addr }}"
        BAO_TOKEN: "{{ openbao_token }}"

    - name: Extract Tailscale auth key
      ansible.builtin.set_fact:
        tailscale_authkey: >-
          {{
            (pihole_secret.stdout | from_json).data.data.TAILSCALE_AUTHKEY
          }}
      no_log: true

    - name: Validate Tailscale auth key
      ansible.builtin.assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
          - tailscale_authkey != "CHANGE_ME_TAILSCALE_AUTHKEY"
        fail_msg: >
          TAILSCALE_AUTHKEY was not found in secret/pihole
          or still contains the CHANGE_ME placeholder.
      no_log: true

    # ============================================================
    # INSTALL TAILSCALE
    # ============================================================

    - name: Install Tailscale prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install Tailscale signing key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Configure Tailscale repository
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    # ============================================================
    # ENABLE TAILSCALED
    # ============================================================

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    # ============================================================
    # IP FORWARDING
    # ============================================================

    - name: Configure IP forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-tailscale.conf
        mode: "0644"
        content: |
          net.ipv4.ip_forward=1
          net.ipv6.conf.all.forwarding=1

    - name: Apply IP forwarding configuration
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    # ============================================================
    # CONFIGURE TAILSCALE
    # ============================================================

    - name: Configure Tailscale
      ansible.builtin.command:
        cmd: >
          tailscale up
          --auth-key={{ tailscale_authkey }}
          --hostname={{ ansible_hostname }}
          --accept-dns
          --advertise-routes={{ tailscale_routes }}
          --ssh=false
          --reset
      register: tailscale_up
      changed_when: true
      no_log: true

    # ============================================================
    # VERIFY
    # ============================================================

    - name: Get Tailscale status
      ansible.builtin.command:
        cmd: tailscale status
      register: tailscale_status
      changed_when: false

    - name: Display Tailscale status
      ansible.builtin.debug:
        var: tailscale_status.stdout
