---
- name: Create cAdvisor directory
  ansible.builtin.file:
    path: /opt/homelab/stacks/cadvisor
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render cAdvisor compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/homelab/stacks/cadvisor/compose.yml
    owner: root
    group: root
    mode: '0644'

- name: Start cAdvisor
  community.docker.docker_compose_v2:
    project_src: /opt/homelab/stacks/cadvisor
    state: present
    pull: missing