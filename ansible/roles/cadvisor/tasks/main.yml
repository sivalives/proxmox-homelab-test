---
- name: Create cAdvisor directory
  ansible.builtin.file:
    path: /opt/homelab/stacks/cadvisor
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render cAdvisor compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/homelab/stacks/cadvisor/compose.yml
    owner: root
    group: root
    mode: '0644'

- name: Start cAdvisor
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/homelab/stacks/cadvisor
  register: cadvisor_compose
  changed_when: >
    'Started' in cadvisor_compose.stdout or
    'Created' in cadvisor_compose.stdout or
    'Recreated' in cadvisor_compose.stdout