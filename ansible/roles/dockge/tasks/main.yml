---
- name: Create homelab root directory
  ansible.builtin.file:
    path: "{{ homelab_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Dockge data directory
  ansible.builtin.file:
    path: "{{ dockge_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ stacks_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Dockge compose file
  ansible.builtin.copy:
    dest: "{{ dockge_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      services:
        dockge:
          image: {{ dockge_image }}
          container_name: {{ dockge_container_name }}
          restart: unless-stopped
          ports:
            - "{{ dockge_port }}:5001"
          environment:
            DOCKGE_STACKS_DIR: {{ stacks_dir }}
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - {{ dockge_data_dir }}:/app/data
            - {{ stacks_dir }}:{{ stacks_dir }}
            - {{ homelab_root }}:{{ homelab_root }}

- name: Pull Dockge image
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ dockge_data_dir }}"
  changed_when: false

- name: Start Dockge
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ dockge_data_dir }}"
  register: dockge_compose
  changed_when: >
    'Created' in dockge_compose.stdout or
    'Started' in dockge_compose.stdout or
    'Recreated' in dockge_compose.stdout

- name: Verify Dockge container
  ansible.builtin.command:
    cmd: docker ps --filter name={{ dockge_container_name }} --format "{{ '{{' }}.Names{{ '}}' }}"
  register: dockge_container
  changed_when: false

- name: Assert Dockge is running
  ansible.builtin.assert:
    that:
      - dockge_container.stdout == dockge_container_name
    fail_msg: "Dockge container is not running"