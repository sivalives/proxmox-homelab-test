---
- name: Validate Hawser OpenBao path
  ansible.builtin.assert:
    that:
      - hawser_openbao_path is defined
      - hawser_openbao_path | length > 0
    fail_msg: >
      hawser_openbao_path must be defined for {{ inventory_hostname }}
      (example: secret/splunk)

- name: Validate OpenBao credential files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /var/lib/openbao/role-id
    - /var/lib/openbao/secret-id
  register: openbao_credential_files

- name: Validate OpenBao credentials
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.size > 0
    fail_msg: "Missing or empty OpenBao credential file: {{ item.item }}"
  loop: "{{ openbao_credential_files.results }}"

- name: Read OpenBao role ID
  ansible.builtin.slurp:
    src: /var/lib/openbao/role-id
  register: openbao_role_id_raw
  no_log: true

- name: Read OpenBao secret ID
  ansible.builtin.slurp:
    src: /var/lib/openbao/secret-id
  register: openbao_secret_id_raw
  no_log: true

- name: Authenticate to OpenBao using AppRole
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ openbao_role_id_raw.content | b64decode | trim }}"
      secret_id: "{{ openbao_secret_id_raw.content | b64decode | trim }}"
    return_content: true
    status_code: 200
  register: openbao_login
  no_log: true

- name: Extract OpenBao client token
  ansible.builtin.set_fact:
    openbao_token: "{{ openbao_login.json.auth.client_token }}"
  no_log: true

- name: Read application secret from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/secret/data/{{ hawser_openbao_path | regex_replace('^secret/', '') }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_token }}"
    return_content: true
    status_code: 200
  register: hawser_secret
  no_log: true

- name: Extract Hawser token
  ansible.builtin.set_fact:
    hawser_token: "{{ hawser_secret.json.data.data.HAWSER_TOKEN }}"
  no_log: true

- name: Validate Hawser token
  ansible.builtin.assert:
    that:
      - hawser_token is defined
      - hawser_token | length > 0
    fail_msg: >
      HAWSER_TOKEN is missing from {{ hawser_openbao_path }}
  no_log: true

- name: Create Hawser directory
  ansible.builtin.file:
    path: "{{ hawser_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write Hawser token
  ansible.builtin.copy:
    content: "{{ hawser_token }}\n"
    dest: "{{ hawser_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Ensure Hawser Compose directory exists
  ansible.builtin.file:
    path: "{{ hawser_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Hawser Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ hawser_compose_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start Hawser
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ hawser_compose_dir }}"
  register: hawser_compose
  changed_when: >
    'Started' in hawser_compose.stdout or
    'Created' in hawser_compose.stdout or
    'Recreated' in hawser_compose.stdout

- name: Display Hawser deployment status
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ hawser_compose_dir }}"
  register: hawser_status
  changed_when: false

- name: Show Hawser status
  ansible.builtin.debug:
    var: hawser_status.stdout_lines