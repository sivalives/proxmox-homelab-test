# ansible/roles/openbao-agent/tasks/main.yml
---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - jq
      - ca-certificates
      - unzip
    state: present
    update_cache: true
  become: true

- name: Set OpenBao version
  ansible.builtin.set_fact:
    openbao_version: "2.6.2"

- name: Create temporary download directory (on real disk)
  ansible.builtin.file:
    path: /var/tmp/openbao-install
    state: directory
    mode: "0755"
  become: true

- name: Download OpenBao binary
  ansible.builtin.get_url:
    url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/openbao_{{ openbao_version }}_linux_amd64.tar.gz"
    dest: /var/tmp/openbao-install/openbao.tar.gz
    mode: "0644"
  become: true

- name: Extract OpenBao binary
  ansible.builtin.unarchive:
    src: /var/tmp/openbao-install/openbao.tar.gz
    dest: /var/tmp/openbao-install
    remote_src: true
    creates: /var/tmp/openbao-install/bao
  become: true

- name: Install OpenBao binary to /usr/local/bin
  ansible.builtin.copy:
    src: /var/tmp/openbao-install/bao
    dest: /usr/local/bin/bao
    mode: "0755"
    remote_src: true
  become: true

- name: Verify OpenBao installation
  ansible.builtin.command: bao version
  register: bao_version_output
  changed_when: false

- name: Show installed version
  ansible.builtin.debug:
    msg: "{{ bao_version_output.stdout }}"

- name: Cleanup temporary files
  ansible.builtin.file:
    path: /var/tmp/openbao-install
    state: absent
  become: true

- name: Create OpenBao directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /var/lib/openbao
    - /var/run/openbao
    - /etc/openbao

- name: Copy OpenBao agent config
  ansible.builtin.template:
    src: openbao-agent.hcl.j2
    dest: /etc/openbao/agent.hcl
    owner: root
    group: root
    mode: "0600"

- name: Copy OpenBao credentials
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - content: "{{ openbao_role_id }}"
      dest: /var/lib/openbao/role-id
    - content: "{{ openbao_secret_id }}"
      dest: /var/lib/openbao/secret-id
  when: enable_openbao_agent | bool

- name: Create OpenBao agent systemd service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=OpenBao Agent
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=notify
      ExecStart=/usr/bin/bao agent -config=/etc/openbao/agent.hcl
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      User=root
      TimeoutStartSec=60
      Environment="BAO_ADDR=http://127.0.0.1:8200"

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/openbao-agent.service
    owner: root
    group: root
    mode: "0644"
  when: enable_openbao_agent | bool

- name: Start OpenBao agent
  ansible.builtin.systemd:
    name: openbao-agent
    daemon_reload: true
    enabled: true
    state: started
  when: enable_openbao_agent | bool

- name: Wait for OpenBao agent socket
  ansible.builtin.wait_for:
    path: /var/run/openbao/agent.sock
    timeout: 30
  when: enable_openbao_agent | bool
  register: agent_socket_ready

- name: Display agent status
  ansible.builtin.command:
    cmd: systemctl status openbao-agent.service
  register: agent_status
  changed_when: false
  when: enable_openbao_agent | bool

- name: Show agent startup result
  ansible.builtin.debug:
    msg:
      - "OpenBao agent setup complete"
      - "{{ agent_status.stdout_lines }}"
  when: enable_openbao_agent | bool