---
- name: Install OpenBao dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - tar
    state: present
    update_cache: true
  become: true

- name: Set OpenBao version
  ansible.builtin.set_fact:
    openbao_version: "2.6.2"

- name: Create temporary OpenBao download directory
  ansible.builtin.file:
    path: /var/tmp/openbao-install
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download OpenBao
  ansible.builtin.get_url:
    url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/openbao_{{ openbao_version }}_linux_amd64.tar.gz"
    dest: "/var/tmp/openbao-install/openbao.tar.gz"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Extract OpenBao
  ansible.builtin.unarchive:
    src: "/var/tmp/openbao-install/openbao.tar.gz"
    dest: "/var/tmp/openbao-install"
    remote_src: true
    creates: "/var/tmp/openbao-install/bao"
  become: true

- name: Install OpenBao CLI
  ansible.builtin.copy:
    src: "/var/tmp/openbao-install/bao"
    dest: "/usr/local/bin/bao"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true

- name: Verify OpenBao installation
  ansible.builtin.command:
    cmd: /usr/local/bin/bao version
  register: bao_version_output
  changed_when: false

- name: Show OpenBao version
  ansible.builtin.debug:
    msg: "{{ bao_version_output.stdout }}"

- name: Create OpenBao credentials directory
  ansible.builtin.file:
    path: /var/lib/openbao
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Copy OpenBao role ID
  ansible.builtin.copy:
    content: "{{ openbao_role_id }}"
    dest: /var/lib/openbao/role-id
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Copy OpenBao secret ID
  ansible.builtin.copy:
    content: "{{ openbao_secret_id }}"
    dest: /var/lib/openbao/secret-id
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Remove temporary OpenBao installation files
  ansible.builtin.file:
    path: /var/tmp/openbao-install
    state: absent
  become: true