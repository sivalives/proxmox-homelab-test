---
- name: Render OpenBao config
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_dir }}/openbao.hcl"
    owner: root
    group: root
    mode: "0644"
  notify: restart openbao

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ openbao_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart openbao

- name: Flush handlers so config changes take effect before we talk to the API
  ansible.builtin.meta: flush_handlers

- name: Ensure OpenBao container is up
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ openbao_base_dir }}"
  changed_when: true

- name: Wait for the OpenBao API to answer (any HTTP status - sealed/uninitialized is fine here)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ openbao_container }}"
      - sh
      - -c
      - "wget -q -S -O /dev/null http://127.0.0.1:8200/v1/sys/health 2>&1 | awk '/HTTP\\// {print $2}'"
  register: health_check
  until: health_check.stdout is match('^[0-9]{3}$')
  retries: 15
  delay: 2
  changed_when: false
