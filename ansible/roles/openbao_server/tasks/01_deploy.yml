---
- name: Render OpenBao config
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_dir }}/openbao.hcl"
    owner: root
    group: root
    mode: "0644"
  notify: restart openbao

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ openbao_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart openbao

- name: Flush handlers so config changes take effect before we talk to the API
  ansible.builtin.meta: flush_handlers

- name: Ensure OpenBao container is up
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ openbao_base_dir }}"
  changed_when: true

- name: Wait for the OpenBao API to answer (sealed/uninitialized is fine here - we just need a response)
  # Deliberately NOT using wget/curl here: this container's wget is BusyBox's,
  # and its `-S` header-dump format doesn't match GNU wget's, which previously
  # broke the awk parsing below and caused this task to spuriously exhaust all
  # retries even though the API was already answering (a 501 "not initialized"
  # response is expected and fine at this point - it just wasn't being parsed
  # correctly). `bao status` is already inside the container and gives us
  # JSON we can trust regardless of wget/curl flavor.
  ansible.builtin.command:
    argv: [docker, exec, "{{ openbao_container }}", bao, status, -format=json]
  register: health_check
  until: health_check.stdout | default('') | trim | length > 0
  retries: 15
  delay: 2
  changed_when: false
  failed_when: false
