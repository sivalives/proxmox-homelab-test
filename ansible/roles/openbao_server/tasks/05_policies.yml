---
# Every stack in openbao_app_stacks shares ONE template
# (templates/policies/app-policy.hcl.j2). Only the stack name changes.
# ui-admin and shared are deliberately separate templates/files.

- name: Render shared-policy.hcl
  ansible.builtin.template:
    src: policies/shared-policy.hcl.j2
    dest: "{{ openbao_policies_dir }}/shared-policy.hcl"
    owner: root
    group: root
    mode: "0644"

- name: Render per-stack policy files from the shared app-policy template
  ansible.builtin.template:
    src: policies/app-policy.hcl.j2
    dest: "{{ openbao_policies_dir }}/{{ stack }}-policy.hcl"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ openbao_app_stacks }}"
  loop_control:
    loop_var: stack

- name: Load shared-policy into OpenBao
  ansible.builtin.command:
    argv: "{{ bao_exec + ['policy', 'write', 'shared-policy', '/openbao/policies/shared-policy.hcl'] }}"
  changed_when: true

- name: Load per-stack policies into OpenBao
  ansible.builtin.command:
    argv: "{{ bao_exec + ['policy', 'write', item + '-policy', '/openbao/policies/' + item + '-policy.hcl'] }}"
  loop: "{{ openbao_app_stacks }}"
  changed_when: true
