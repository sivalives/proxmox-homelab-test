---
# Same contract as your old 03-openbao-setup-secrets.sh: create the
# secret if it doesn't exist yet, NEVER touch it if it does.

- name: Check whether secret/shared already exists
  ansible.builtin.command:
    argv: "{{ bao_exec + ['kv', 'get', kv_mount + '/shared'] }}"
  register: shared_check
  changed_when: false
  failed_when: false

- name: Create placeholder secret/shared (first run only)
  ansible.builtin.command:
    argv: >-
      {{
        bao_exec + ['kv', 'put', kv_mount + '/shared'] +
        (openbao_shared_secrets | dict2items | map(attribute='key')
          | zip(openbao_shared_secrets | dict2items | map(attribute='value'))
          | map('join', '=') | list)
      }}
  when: shared_check.rc != 0
  no_log: true
  changed_when: true

- name: Check whether each per-stack secret already exists
  ansible.builtin.command:
    argv: "{{ bao_exec + ['kv', 'get', kv_mount + '/' + item.key] }}"
  loop: "{{ openbao_stack_secrets | dict2items }}"
  register: stack_secret_check
  changed_when: false
  failed_when: false

- name: Create placeholder per-stack secrets (first run only, existing values untouched)
  ansible.builtin.command:
    argv: >-
      {{
        bao_exec + ['kv', 'put', kv_mount + '/' + item.item.key] +
        (item.item.value | dict2items | map(attribute='key')
          | zip(item.item.value | dict2items | map(attribute='value'))
          | map('join', '=') | list)
      }}
  loop: "{{ stack_secret_check.results }}"
  when: item.rc != 0
  no_log: true
  changed_when: true
