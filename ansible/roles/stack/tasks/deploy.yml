---
- name: Set facts for this compose project
  ansible.builtin.set_fact:
    stack_service_dir: "{{ compose_file.path | dirname }}"
    stack_service_name: "{{ compose_file.path | dirname | basename }}"

# -------------------------------------------------------------------
# OpenBao
# -------------------------------------------------------------------

- name: Verify OpenBao CLI exists
  ansible.builtin.stat:
    path: /usr/local/bin/bao
  register: bao_binary

- name: Fail if OpenBao CLI is missing
  ansible.builtin.fail:
    msg: >
      /usr/local/bin/bao was not found.
      Make sure the OpenBao role runs before the stack role.
  when: not bao_binary.stat.exists

- name: Authenticate to OpenBao using AppRole
  ansible.builtin.shell:
    cmd: |
      set -o pipefail

      ROLE_ID="$(cat /var/lib/openbao/role-id)"
      SECRET_ID="$(cat /var/lib/openbao/secret-id)"

      /usr/local/bin/bao write \
        -field=token \
        auth/approle/login \
        role_id="$ROLE_ID" \
        secret_id="$SECRET_ID"
    executable: /bin/bash
  environment:
    BAO_ADDR: "{{ openbao_addr }}"
  register: openbao_login
  changed_when: false
  no_log: true

- name: Verify OpenBao authentication
  ansible.builtin.assert:
    that:
      - openbao_login.stdout | trim | length > 0
    fail_msg: "OpenBao AppRole authentication failed."

# -------------------------------------------------------------------
# Fetch secrets
# -------------------------------------------------------------------

- name: Fetch shared secrets from OpenBao
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/bao kv get
      -format=json
      -address={{ openbao_addr }}
      secret/shared
  environment:
    BAO_TOKEN: "{{ openbao_login.stdout | trim }}"
  register: openbao_shared_secrets
  changed_when: false
  no_log: true

- name: Fetch stack secrets from OpenBao
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/bao kv get
      -format=json
      -address={{ openbao_addr }}
      secret/{{ stack_name }}
  environment:
    BAO_TOKEN: "{{ openbao_login.stdout | trim }}"
  register: openbao_stack_secrets
  changed_when: false
  no_log: true

- name: Build shared secrets
  ansible.builtin.set_fact:
    shared_secrets: >-
      {{
        (openbao_shared_secrets.stdout | from_json).data.data
        | default({})
      }}
  no_log: true

- name: Build stack secrets
  ansible.builtin.set_fact:
    app_secrets: >-
      {{
        (openbao_stack_secrets.stdout | from_json).data.data
        | default({})
      }}
  no_log: true

- name: Debug shared OpenBao response structure
  ansible.builtin.debug:
    msg:
      rc: "{{ openbao_shared_secrets.rc }}"
      stdout_start: "{{ openbao_shared_secrets.stdout[:500] }}"
      stderr: "{{ openbao_shared_secrets.stderr | default('') }}"
  no_log: false

- name: Debug stack OpenBao response structure
  ansible.builtin.debug:
    msg:
      rc: "{{ openbao_stack_secrets.rc }}"
      stdout_start: "{{ openbao_stack_secrets.stdout[:500] }}"
      stderr: "{{ openbao_stack_secrets.stderr | default('') }}"
  no_log: false

- name: Parse shared OpenBao secrets
  ansible.builtin.set_fact:
    shared_secrets: >-
      {{ (openbao_shared_secrets.stdout | from_json).data.data }}
  no_log: true

- name: Parse stack OpenBao secrets
  ansible.builtin.set_fact:
    app_secrets: >-
      {{ (openbao_stack_secrets.stdout | from_json).data.data }}
  no_log: true

- name: Display fetched secret keys
  ansible.builtin.debug:
    msg:
      - "Shared secrets: {{ shared_secrets.keys() | list }}"
      - "Stack secrets: {{ app_secrets.keys() | list }}"

# -------------------------------------------------------------------
# Create service directory
# -------------------------------------------------------------------

- name: Create service directory
  ansible.builtin.file:
    path: "{{ stacks_root }}/{{ stack_name }}/{{ stack_service_name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# -------------------------------------------------------------------
# Render .env
# -------------------------------------------------------------------

- name: Check if .env.j2 template exists
  ansible.builtin.stat:
    path: "{{ stack_service_dir }}/.env.j2"
  register: env_template
  delegate_to: localhost
  become: false

- name: Render .env from template
  ansible.builtin.template:
    src: "{{ stack_service_dir }}/.env.j2"
    dest: "{{ stacks_root }}/{{ stack_name }}/{{ stack_service_name }}/.env"
    owner: root
    group: root
    mode: "0600"
  vars:
    secrets: "{{ app_secrets }}"
  when: env_template.stat.exists
  register: env_rendered
  no_log: true

- name: Display .env file rendered
  ansible.builtin.debug:
    msg: ".env file rendered for {{ stack_service_name }}"
  when: env_rendered is changed

# -------------------------------------------------------------------
# Copy Docker Compose file
# -------------------------------------------------------------------

- name: Copy docker-compose file
  ansible.builtin.copy:
    src: "{{ compose_file.path }}"
    dest: "{{ stacks_root }}/{{ stack_name }}/{{ stack_service_name }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# -------------------------------------------------------------------
# Deploy
# -------------------------------------------------------------------

- name: Deploy with Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ stacks_root }}/{{ stack_name }}/{{ stack_service_name }}"
  register: compose_up
  changed_when: compose_up.rc == 0

- name: Show compose up output
  ansible.builtin.debug:
    msg: "{{ compose_up.stdout_lines | default([]) }}"
  when: compose_up.stdout is defined and compose_up.stdout != ""

- name: Fail if Docker Compose deployment failed
  ansible.builtin.fail:
    msg: |
      Docker Compose deployment failed for {{ stack_service_name }}.

      stdout:
      {{ compose_up.stdout | default('') }}

      stderr:
      {{ compose_up.stderr | default('') }}

      rc: {{ compose_up.rc | default('unknown') }}
  when: compose_up.rc != 0

# -------------------------------------------------------------------
# Status
# -------------------------------------------------------------------

- name: Show compose project status
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ stacks_root }}/{{ stack_name }}/{{ stack_service_name }}"
  register: compose_status
  changed_when: false

- name: Display service status
  ansible.builtin.debug:
    msg:
      - "Service: {{ stack_service_name }}"
      - "Status:"
      - "{{ compose_status.stdout }}"
