# ansible/roles/stack/tasks/deploy.yml
---
- name: Set facts for this compose project
  ansible.builtin.set_fact:
    compose_dir: "{{ compose_file.path | dirname }}"
    compose_filename: "{{ compose_file.path | basename }}"

# -------------------------------------------------------------------
# OpenBao
# -------------------------------------------------------------------

- name: Verify OpenBao CLI exists
  ansible.builtin.stat:
    path: /usr/local/bin/bao
  register: bao_binary

- name: Fail if OpenBao CLI is missing
  ansible.builtin.fail:
    msg: /usr/local/bin/bao was not found. Make sure the OpenBao agent is running.
  when: not bao_binary.stat.exists

- name: Authenticate to OpenBao using AppRole
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ROLE_ID="$(cat /var/lib/openbao/role-id)"
      SECRET_ID="$(cat /var/lib/openbao/secret-id)"
      /usr/local/bin/bao write -field=token auth/approle/login role_id="$ROLE_ID" secret_id="$SECRET_ID"
    executable: /bin/bash
  environment:
    BAO_ADDR: "{{ openbao_addr }}"
  register: openbao_login
  changed_when: false
  no_log: true

- name: Verify OpenBao authentication
  ansible.builtin.assert:
    that:
      - openbao_login.stdout | trim | length > 0
    fail_msg: "OpenBao AppRole authentication failed."

# -------------------------------------------------------------------
# Fetch secrets
# -------------------------------------------------------------------

- name: Fetch stack secrets from OpenBao
  ansible.builtin.command:
    cmd: /usr/local/bin/bao kv get -format=json -address={{ openbao_addr }} secret/{{ stack_name }}
  environment:
    BAO_TOKEN: "{{ openbao_login.stdout | trim }}"
  register: openbao_stack_secrets
  changed_when: false
  no_log: true

- name: Parse stack secrets
  ansible.builtin.set_fact:
    app_secrets: "{{ (openbao_stack_secrets.stdout | from_json).data.data }}"
  no_log: true

- name: Display fetched secret keys
  ansible.builtin.debug:
    msg: "Stack secrets: {{ app_secrets.keys() | list }}"

# -------------------------------------------------------------------
# Render .env from template
# -------------------------------------------------------------------

- name: Check if .env.j2 template exists
  ansible.builtin.stat:
    path: "{{ compose_dir }}/.env.j2"
  register: env_template

- name: Render .env from template using envsubst
  ansible.builtin.shell:
    cmd: |
      cd "{{ compose_dir }}"
      envsubst < .env.j2 > .env
      chmod 600 .env
    executable: /bin/bash
  environment: "{{ app_secrets }}"
  when: env_template.stat.exists
  no_log: true

- name: Display .env rendered
  ansible.builtin.debug:
    msg: ".env rendered at {{ compose_dir }}/.env"
  when: env_template.stat.exists

# -------------------------------------------------------------------
# Deploy
# -------------------------------------------------------------------

- name: Deploy with Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ compose_dir }}"
  register: compose_up
  changed_when: compose_up.rc == 0

- name: Show compose up output
  ansible.builtin.debug:
    msg: "{{ compose_up.stdout_lines }}"
  when: compose_up.stdout is defined

- name: Fail if Docker Compose deployment failed
  ansible.builtin.fail:
    msg: "Docker Compose deployment failed at {{ compose_dir }}.\nstdout: {{ compose_up.stdout }}\nstderr: {{ compose_up.stderr }}"
  when: compose_up.rc != 0

# -------------------------------------------------------------------
# Status
# -------------------------------------------------------------------

- name: Show compose project status
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ compose_dir }}"
  register: compose_status
  changed_when: false

- name: Display service status
  ansible.builtin.debug:
    msg:
      - "Compose file: {{ compose_filename }}"
      - "Location: {{ compose_dir }}"
      - "Status:"
      - "{{ compose_status.stdout }}"