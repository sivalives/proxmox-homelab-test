# -------------------------------------------------------------------
# Compose project paths
# -------------------------------------------------------------------

- name: Set facts for this Compose project
  ansible.builtin.set_fact:
    compose_dir: "{{ compose_file.path | dirname }}"
    compose_filename: "{{ compose_file.path | basename }}"

- name: Display Compose project
  ansible.builtin.debug:
    msg:
      - "Compose file: {{ compose_filename }}"
      - "Compose directory: {{ compose_dir }}"

# -------------------------------------------------------------------
# OpenBao
# -------------------------------------------------------------------

- name: Verify OpenBao CLI exists
  ansible.builtin.stat:
    path: /usr/local/bin/bao
  register: bao_binary

- name: Fail if OpenBao CLI is missing
  ansible.builtin.fail:
    msg: >
      /usr/local/bin/bao was not found.
      Make sure the OpenBao CLI role runs before the stack role.
  when: not bao_binary.stat.exists

- name: Authenticate to OpenBao using AppRole
  ansible.builtin.shell:
    cmd: |
      set -o pipefail

      ROLE_ID="$(cat /var/lib/openbao/role-id)"
      SECRET_ID="$(cat /var/lib/openbao/secret-id)"

      /usr/local/bin/bao write \
        -field=token \
        auth/approle/login \
        role_id="$ROLE_ID" \
        secret_id="$SECRET_ID"
    executable: /bin/bash
  environment:
    BAO_ADDR: "{{ openbao_addr }}"
  register: openbao_login
  changed_when: false
  no_log: true

- name: Verify OpenBao authentication
  ansible.builtin.assert:
    that:
      - openbao_login.stdout | trim | length > 0
    fail_msg: "OpenBao AppRole authentication failed."

# -------------------------------------------------------------------
# Fetch secrets (optional - some stacks may not have secrets)
# -------------------------------------------------------------------

- name: Fetch shared secrets from OpenBao
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/bao kv get
      -format=json
      -address={{ openbao_addr }}
      secret/shared
  environment:
    BAO_TOKEN: "{{ openbao_login.stdout | trim }}"
  register: openbao_shared_secrets
  changed_when: false
  failed_when: false
  no_log: true

- name: Fetch stack secrets from OpenBao
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/bao kv get
      -format=json
      -address={{ openbao_addr }}
      secret/{{ stack_name }}
  environment:
    BAO_TOKEN: "{{ openbao_login.stdout | trim }}"
  register: openbao_stack_secrets
  changed_when: false
  failed_when: false
  no_log: true

# -------------------------------------------------------------------
# Parse secrets (only if they exist)
# -------------------------------------------------------------------

- name: Parse shared OpenBao secrets
  ansible.builtin.set_fact:
    shared_secrets: >-
      {{ (openbao_shared_secrets.stdout | from_json).data.data | default({}) }}
  when:
    - openbao_shared_secrets.rc == 0
    - openbao_shared_secrets.stdout | trim | length > 0
  no_log: true

- name: Set empty shared secrets if not found
  ansible.builtin.set_fact:
    shared_secrets: {}
  when:
    - openbao_shared_secrets.rc != 0 or openbao_shared_secrets.stdout | trim | length == 0

- name: Parse stack OpenBao secrets
  ansible.builtin.set_fact:
    app_secrets: >-
      {{ (openbao_stack_secrets.stdout | from_json).data.data | default({}) }}
  when:
    - openbao_stack_secrets.rc == 0
    - openbao_stack_secrets.stdout | trim | length > 0
  no_log: true

- name: Set empty stack secrets if not found
  ansible.builtin.set_fact:
    app_secrets: {}
  when:
    - openbao_stack_secrets.rc != 0 or openbao_stack_secrets.stdout | trim | length == 0

- name: Display fetched secret keys
  ansible.builtin.debug:
    msg:
      - "Shared secrets: {{ shared_secrets.keys() | list }}"
      - "Stack secrets: {{ app_secrets.keys() | list }}"
      - "Note: Empty dicts indicate no secrets defined for this stack"

# -------------------------------------------------------------------
# Render .env (optional - only if .env.j2 exists)
# -------------------------------------------------------------------

- name: Compute relative compose path (for nested stacks)
  ansible.builtin.set_fact:
    compose_rel_path: "{{ compose_dir | regex_replace('^' + stacks_root + '/?', '') }}"

- name: Check if .env.j2 template exists
  ansible.builtin.stat:
    path: "{{ stack_source_root }}/{{ compose_rel_path }}/.env.j2"
  register: env_template
  delegate_to: localhost
  become: false

- name: Render .env from template
  ansible.builtin.template:
    src: "{{ stack_source_root }}/{{ compose_rel_path }}/.env.j2"
    dest: "{{ compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  vars:
    app_secrets: "{{ app_secrets | default({}) }}"
    shared_secrets: "{{ shared_secrets | default({}) }}"
    secrets: "{{ app_secrets | default({}) }}"   # keep alias if your templates use it
  when: env_template.stat.exists
  register: env_rendered
  no_log: false

- name: Display .env file rendered
  ansible.builtin.debug:
    msg: ".env file rendered at {{ compose_dir }}/.env"
  when: env_template.stat.exists

- name: Display skipped .env file
  ansible.builtin.debug:
    msg: "No .env.j2 template found at {{ stack_source_root }}/{{ compose_rel_path }}/.env.j2 – skipping"
  when: not env_template.stat.exists

# -------------------------------------------------------------------
# Render other Jinja templates (excluding .env.j2)
# -------------------------------------------------------------------

- name: Find Jinja templates
  ansible.builtin.find:
    paths: "{{ stack_source_root }}/{{ compose_rel_path }}"
    patterns: "*.j2"
    excludes:
      - ".env.j2"
    recurse: true
    file_type: file
  register: jinja_templates
  delegate_to: localhost
  become: false

- name: Render Jinja templates
  ansible.builtin.template:
    src: "{{ item.path }}"
    dest: "{{ compose_dir }}/{{ item.path | relpath(stack_source_root + '/' + compose_rel_path) | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ jinja_templates.files }}"
  vars:
    app_secrets: "{{ app_secrets | default({}) }}"
    shared_secrets: "{{ shared_secrets | default({}) }}"
    secrets: "{{ app_secrets | default({}) }}"
  no_log: false
    

# -------------------------------------------------------------------
# Deploy with Docker Compose
# -------------------------------------------------------------------

- name: Prepare application storage - set correct permissiong from group_vars for each stack
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ app_storage | default([]) }}"

- name: Deploy with Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: "{{ compose_dir }}"
  register: compose_up
  changed_when: compose_up.rc == 0

- name: Show Compose output
  ansible.builtin.debug:
    msg: "{{ compose_up.stdout_lines | default([]) }}"
  when:
    - compose_up.stdout is defined
    - compose_up.stdout != ""

- name: Fail if Docker Compose deployment failed
  ansible.builtin.fail:
    msg: |
      Docker Compose deployment failed at {{ compose_dir }}.

      stdout:
      {{ compose_up.stdout | default('') }}

      stderr:
      {{ compose_up.stderr | default('') }}

      rc: {{ compose_up.rc | default('unknown') }}
  when: compose_up.rc != 0

# -------------------------------------------------------------------
# Status
# -------------------------------------------------------------------

- name: Show Compose project status
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ compose_dir }}"
  register: compose_status
  changed_when: false

- name: Display service status
  ansible.builtin.debug:
    msg:
      - "Compose file: {{ compose_filename }}"
      - "Location: {{ compose_dir }}"
      - "Status:"
      - "{{ compose_status.stdout }}"
