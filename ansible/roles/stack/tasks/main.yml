---
- name: Validate stack name
  ansible.builtin.assert:
    that:
      - stack_name is defined
      - stack_name | length > 0
    fail_msg: "stack_name must be provided (e.g., -e stack_name=splunk)"

# -------------------------------------------------------------------
# Copy complete stack directory to target LXC
# -------------------------------------------------------------------

- name: Copy entire stack directory to destination
  ansible.builtin.copy:
    src: "{{ stack_source_root }}/{{ stack_name }}/"
    dest: "{{ stacks_root }}/{{ stack_name }}/"
    owner: root
    group: root
    directory_mode: "0755"
    mode: "0644"

# -------------------------------------------------------------------
# Find Compose projects in copied directory
# -------------------------------------------------------------------

- name: Find all Compose projects in copied stack
  ansible.builtin.find:
    paths: "{{ stacks_root }}/{{ stack_name }}"
    patterns:
      - "compose.yml"
      - "compose.yaml"
      - "docker-compose.yml"
      - "docker-compose.yaml"
    recurse: true
    file_type: file
  register: all_compose_files

- name: Select requested application Compose file
  ansible.builtin.set_fact:
    compose_files:
      files: >-
        {{
          all_compose_files.files
          | selectattr('path', 'search', '/' ~ app_name ~ '/(compose\.yml|compose\.yaml|docker-compose\.yml|docker-compose\.yaml)$')
          | list
        }}
  when: app_name is defined

- name: Select all Compose files when no application specified
  ansible.builtin.set_fact:
    compose_files: "{{ all_compose_files }}"
  when: app_name is not defined

# -------------------------------------------------------------------
# Deploy each Compose project
# -------------------------------------------------------------------

- name: Deploy stack with OpenBao secrets
  ansible.builtin.include_tasks: deploy.yml
  loop: "{{ compose_files.files }}"
  loop_control:
    loop_var: compose_file