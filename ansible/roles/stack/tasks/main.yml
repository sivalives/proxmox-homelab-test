# ansible/roles/stack/tasks/main.yml
---
- name: Validate stack name
  ansible.builtin.assert:
    that:
      - stack_name is defined
      - stack_name | length > 0
    fail_msg: "stack_name must be provided (e.g., -e stack_name=splunk)"

- name: Copy entire stack directory to destination
  ansible.builtin.copy:
    src: "{{ stack_source_root }}/{{ stack_name }}/"
    dest: "{{ stacks_root }}/{{ stack_name }}/"
    owner: root
    group: root
    directory_mode: "0755"
    mode: "0644"

- name: Find Compose projects in copied directory
  ansible.builtin.find:
    paths: "{{ stacks_root }}/{{ stack_name }}"
    patterns:
      - "compose.yml"
      - "compose.yaml"
      - "docker-compose.yml"
      - "docker-compose.yaml"
    recurse: true
    file_type: file
  register: compose_files

- name: Assert Compose projects exist
  ansible.builtin.assert:
    that:
      - compose_files.files | length > 0
    fail_msg: "No compose files found under {{ stacks_root }}/{{ stack_name }}"

- name: Deploy stack with OpenBao secrets
  ansible.builtin.include_tasks: deploy.yml
  loop: "{{ compose_files.files }}"
  loop_control:
    loop_var: compose_file