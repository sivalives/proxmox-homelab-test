# ansible/roles/stack/tasks/main.yml
---
- name: Validate stack name
  ansible.builtin.assert:
    that:
      - stack_name is defined
      - stack_name | length > 0
    fail_msg: "stack_name must be provided (e.g., -e stack_name=splunk)"

- name: Find Compose projects
  ansible.builtin.find:
    paths: "{{ stack_source_root }}/{{ stack_name }}"
    patterns:
      - "compose.yml"
      - "compose.yaml"
      - "docker-compose.yml"
      - "docker-compose.yaml"
    recurse: true
    file_type: file
  delegate_to: localhost
  become: false
  register: compose_files

- name: Assert Compose projects exist
  ansible.builtin.assert:
    that:
      - compose_files.files | length > 0
    fail_msg: "No compose files found under {{ stack_source_root }}/{{ stack_name }}"

- name: Create stack directory
  ansible.builtin.file:
    path: "{{ stacks_root }}/{{ stack_name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy stack with OpenBao secrets
  ansible.builtin.include_tasks: deploy.yml
  loop: "{{ compose_files.files }}"
  loop_control:
    loop_var: compose_file