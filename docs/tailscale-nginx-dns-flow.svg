<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How a request reaches Splunk through DNS, Tailscale, and Nginx</title>
<desc>A laptop sends a request for splunk.local. DNS resolves the name to an IP. Tailscale provides the tunnel if remote. Nginx receives the connection and routes it to the Splunk container based on the requested hostname.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.t  { font-size: 14px; fill: #2c2c2a; }
.ts { font-size: 12px; fill: #5f5e5a; }
.th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
.box { fill: #f1efe8; stroke: #888780; }
.c-gray rect, .c-gray { fill: #f1efe8; stroke: #888780; }
.c-gray .th, .c-gray .t { fill: #2c2c2a; }
.c-gray .ts { fill: #5f5e5a; }
.c-blue rect, .c-blue { fill: #e6f1fb; stroke: #378ADD; }
.c-blue .th, .c-blue .t { fill: #042c53; }
.c-blue .ts { fill: #0c447c; }
.c-purple rect, .c-purple { fill: #eeedfe; stroke: #7f77dd; }
.c-purple .th, .c-purple .t { fill: #26215c; }
.c-purple .ts { fill: #3c3489; }
.c-coral rect, .c-coral { fill: #faece7; stroke: #d85a30; }
.c-coral .th, .c-coral .t { fill: #4a1b0c; }
.c-coral .ts { fill: #712b13; }
.c-teal rect, .c-teal { fill: #e1f5ee; stroke: #1d9e75; }
.c-teal .th, .c-teal .t { fill: #04342c; }
.c-teal .ts { fill: #085041; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; }
</style>

<g class="c-gray">
  <rect x="40" y="20" width="160" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="120" y="40" text-anchor="middle" dominant-baseline="central">Your laptop</text>
  <text class="ts" x="120" y="58" text-anchor="middle" dominant-baseline="central">asks for splunk.local</text>
</g>

<line x1="120" y1="76" x2="120" y2="116" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
  <rect x="20" y="120" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="120" y="140" text-anchor="middle" dominant-baseline="central">Step 1: DNS lookup</text>
  <text class="ts" x="120" y="158" text-anchor="middle" dominant-baseline="central">name to IP address</text>
</g>

<line x1="220" y1="148" x2="280" y2="148" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
  <rect x="284" y="120" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="374" y="140" text-anchor="middle" dominant-baseline="central">/etc/hosts or Pi-hole</text>
  <text class="ts" x="374" y="158" text-anchor="middle" dominant-baseline="central">answers: 192.168.1.106</text>
</g>

<line x1="120" y1="176" x2="120" y2="216" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="20" y="220" width="380" height="120" rx="20" stroke-width="0.5"/>
  <text class="th" x="40" y="244">Step 2: get to the network</text>
</g>

<g class="c-purple">
  <rect x="40" y="260" width="160" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="120" y="280" text-anchor="middle" dominant-baseline="central">Tailscale tunnel</text>
  <text class="ts" x="120" y="298" text-anchor="middle" dominant-baseline="central">only if away from home</text>
</g>

<text class="ts" x="225" y="294" text-anchor="middle">or</text>

<g class="c-purple">
  <rect x="250" y="260" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="280" text-anchor="middle" dominant-baseline="central">Home WiFi</text>
  <text class="ts" x="320" y="298" text-anchor="middle" dominant-baseline="central">direct LAN access</text>
</g>

<line x1="210" y1="350" x2="210" y2="390" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
  <rect x="60" y="394" width="300" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="210" y="414" text-anchor="middle" dominant-baseline="central">Step 3: Nginx at 192.168.1.106</text>
  <text class="ts" x="210" y="432" text-anchor="middle" dominant-baseline="central">reads the requested hostname</text>
</g>

<line x1="210" y1="450" x2="210" y2="478" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="60" y="482" width="300" height="32" rx="8" stroke-width="0.5"/>
  <text class="th" x="210" y="498" text-anchor="middle" dominant-baseline="central">Splunk container loads</text>
</g>

<g class="c-gray">
  <rect x="440" y="220" width="200" height="240" rx="12" stroke-width="0.5"/>
  <text class="th" x="540" y="244" text-anchor="middle">Three separate jobs</text>
  <text class="ts" x="460" y="276">DNS</text>
  <text class="ts" x="460" y="294">translates a name</text>
  <text class="ts" x="460" y="330">Tailscale</text>
  <text class="ts" x="460" y="348">gets you to the network</text>
  <text class="ts" x="460" y="384">Nginx</text>
  <text class="ts" x="460" y="402">routes inside the network</text>
</g>
</svg>
