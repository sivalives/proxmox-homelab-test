services:
  docker-mcp:
    build: .
    container_name: docker-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ai-data/docker-mcp/certs:/app/certs:ro
    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: pihole
        splunk-verify-connection: "false"
        splunk-format: json
        tag: pihole