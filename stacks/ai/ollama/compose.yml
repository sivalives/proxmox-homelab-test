services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /opt/ai-data/ollama:/root/.ollama
      - /opt/ai-data/models:/models:ro
    networks:
      - ai

networks:
  ai:
    name: ai
    driver: bridge