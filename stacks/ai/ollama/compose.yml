services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /opt/ai-data/ollama:/root/.ollama
      - /opt/ai-data/models:/models:ro
    networks:
      - ai
    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: ollama
        splunk-verify-connection: "false"
        splunk-format: json
        tag: ollama

networks:
  ai:
    name: ai
    driver: bridge