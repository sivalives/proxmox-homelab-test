- Messaging:
    - Ntfy History:
        icon: ntfy
        href: http://ntfy.lan
        description: Live Proxmox Logs
        widget:
          type: customapi
          url: http://192.168.1 # Poll parameter converts the stream to a readable array snapshot
          method: GET
          headers:
            Authorization: Basic c2l2YTpzaXZh
          mappings:
            - field: 0.message
              label: "1st Recent"
            - field: 1.message
              label: "2nd Recent"
            - field: 2.message
              label: "3rd Recent"