services:

  proxmox-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: proxmox-exporter
    restart: unless-stopped

    environment:
      PVE_USER: "${PVE_USER}"
      PVE_TOKEN_NAME: "${PVE_TOKEN_NAME}"
      PVE_TOKEN_VALUE: "${PVE_TOKEN_VALUE}"
      PVE_VERIFY_SSL: "false"

    ports:
      - "9221:9221"

    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: proxmox-exporter
        splunk-verify-connection: "false"
        splunk-format: json
        tag: proxmox-exporter


  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: dockership-monitor
    restart: unless-stopped

    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    ports:
      - "19999:19999"

    volumes:
      - /opt/homelab/stacks/dockership/monitoring/config/netdata:/etc/netdata
      - /opt/docker-data/netdata/lib:/var/lib/netdata
      - /opt/docker-data/netdata/cache:/var/cache/netdata

      # Docker monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Required by Netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro

    depends_on:
      - proxmox-exporter

    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: netdata
        splunk-verify-connection: "false"
        splunk-format: json
        tag: netdata