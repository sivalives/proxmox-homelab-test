services:

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: dockership-monitor
    restart: unless-stopped

    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    ports:
      - "19999:19999"

    volumes:
      # Netdata configuration
      - /opt/homelab/stacks/dockership/netdata/config:/etc/netdata

      # Persistent Netdata data
      - /opt/docker-data/netdata/lib:/var/lib/netdata
      - /opt/docker-data/netdata/cache:/var/cache/netdata

      # Docker monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Required by Netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro

    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: netdata
        splunk-verify-connection: "false"
        splunk-format: json
        tag: netdata
        
    #Use networks to connect to the monitoring network for Prometheus scraping
    networks:
      - monitoring

networks:
  monitoring:
    external: true