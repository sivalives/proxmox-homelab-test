jobs:
  - name: proxmox
    url: http://proxmox-exporter:9221/pve?target=192.168.1.100
    timeout: 10s
    
    # Explicitly whitelist pve_* metrics
    pattern:
      - "pve_.*"
    
    # Optional: Match only high-priority metrics to reduce cardinality
    # pattern:
    #   - "pve_disk_usage_bytes"
    #   - "pve_memory_usage_bytes"
    #   - "pve_cpu_usage_ratio"
    #   - "pve_container_uptime_seconds"