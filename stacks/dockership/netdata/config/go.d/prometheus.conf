jobs:
  - name: proxmox
    url: http://proxmox-exporter:9221/pve?target=192.168.1.100
    timeout: 10s
    
    # Only these metrics → charts (no label filtering)
    pattern:
      - "^pve_disk_usage_bytes$"
      - "^pve_memory_usage_bytes$"
      - "^pve_memory_limit_bytes$"
      - "^pve_container_uptime_seconds$"
      - "^pve_cpu_usage$"