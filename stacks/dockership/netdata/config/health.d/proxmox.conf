# ============================================================
# Proxmox LXC / VM DOWN
# ============================================================

template: proxmox_guest_down
       on: pve_up
    class: Errors
     type: Virtualization
component: Proxmox
    units: status
    every: 10s
   lookup: average -10s
     warn: $this < 1
    delay: down 1m multiplier 1.5 max 2h
  summary: Proxmox guest ${label:id} down
     info: Proxmox guest ${label:id} is currently not running
       to: sysadmin


# ============================================================
# PROXMOX CPU HIGH
# pve_cpu_usage_ratio:
#   0.85 = 85%
#   0.95 = 95%
# ============================================================

template: proxmox_guest_cpu_high
       on: pve_cpu_usage_ratio
    class: Utilization
     type: Virtualization
component: Proxmox
    units: percentage
    every: 10s
   lookup: average -5m
     warn: $this > 0.85
     crit: $this > 0.95
    delay: up 5m down 1m
  summary: Proxmox guest ${label:id} high CPU
     info: Proxmox guest ${label:id} CPU usage is ${this}
       to: sysadmin


# ============================================================
# PROXMOX MEMORY HIGH
# ============================================================

template: proxmox_guest_memory_high
       on: pve_memory_usage_bytes
    class: Utilization
     type: Virtualization
component: Proxmox
    units: percentage
    every: 10s
   lookup: average -5m
     warn: $this > 85
     crit: $this > 95
    delay: up 5m down 1m
  summary: Proxmox guest ${label:id} high memory
     info: Proxmox guest ${label:id} memory usage is high
       to: sysadmin


# ============================================================
# PROXMOX DISK HIGH
# ============================================================

template: proxmox_guest_disk_high
       on: pve_disk_usage_bytes
    class: Utilization
     type: Virtualization
component: Proxmox
    units: percentage
    every: 30s
   lookup: average -5m
     warn: $this > 80
     crit: $this > 90
    delay: up 5m down 1m
  summary: Proxmox guest ${label:id} high disk usage
     info: Proxmox guest ${label:id} disk usage is high
       to: sysadmin


# ============================================================
# PROXMOX EXPORTER CONTAINER DOWN
# ============================================================

template: proxmox_exporter_down
       on: docker.container_state
    class: Errors
     type: Containers
component: Docker
chart labels: container_name=proxmox-exporter
    units: status
    every: 10s
   lookup: average -10s of exited
     warn: $this > 0
    delay: down 1m multiplier 1.5 max 2h
  summary: Proxmox exporter down
     info: Proxmox exporter container is currently not running
       to: sysadmin


# ============================================================
# PROXMOX EXPORTER UNHEALTHY
# ============================================================

template: proxmox_exporter_unhealthy
       on: docker.container_health_status
    class: Errors
     type: Containers
component: Docker
chart labels: container_name=proxmox-exporter
    units: status
    every: 10s
   lookup: average -10s of unhealthy
     warn: $this > 0
  summary: Proxmox exporter unhealthy
     info: Proxmox exporter container health status is unhealthy
       to: sysadmin