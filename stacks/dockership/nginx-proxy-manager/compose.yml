services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped

    ports:
      - "80:80"
      - "81:81"
      - "443:443"

    environment:
      TZ: Asia/Kolkata

    volumes:
      - /opt/docker-data/npm/data:/data
      - /opt/docker-data/npm/letsencrypt:/etc/letsencrypt