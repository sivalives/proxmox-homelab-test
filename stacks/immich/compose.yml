name: immich

services:

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    pull_policy: always
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    logging:
      driver: splunk
      options:
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-source: ${SPLUNK_LOG_SOURCE:-immich}
        splunk-sourcetype: "docker:immich-server"
        tag: "{{.Name}}/{{.ID}}"
        labels: "immich-component=server"

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    pull_policy: always
    volumes:
      - ${MODEL_CACHE_FOLDER}:/cache
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      disable: false
    logging:
      driver: splunk
      options:
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-source: ${SPLUNK_LOG_SOURCE:-immich}
        splunk-sourcetype: "docker:immich-ml"
        tag: "{{.Name}}/{{.ID}}"
        labels: "immich-component=ml"

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    pull_policy: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: splunk
      options:
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-source: ${SPLUNK_LOG_SOURCE:-immich}
        splunk-sourcetype: "docker:valkey"
        tag: "{{.Name}}/{{.ID}}"
        labels: "immich-component=redis"

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    pull_policy: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --dbname=\"$${POSTGRES_DB}\" --username=\"$${POSTGRES_USER}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: immich
        splunk-verify-connection: "false"
        splunk-format: json
        tag: immich

volumes:
  model-cache: