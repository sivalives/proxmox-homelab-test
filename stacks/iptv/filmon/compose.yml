services:
  filmon_iptv:
    build: .
    container_name: filmon-iptv
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      # Address Jellyfin uses to reach THIS container. Use the LXC's IP (or a shared
      # docker network + service name, e.g. http://filmon-iptv:8765).
      PUBLIC_BASE_URL: "http://192.168.1.107:8765"   # <-- change to your LXC IP

      HLS_UPSTREAM_REFRESH: "30"
      HLS_TOKEN_TTL: "86400"
      HLS_TIMEOUT: "15"
      HLS_RETRY_COUNT: "2"

      #HLS_SEGMENT_CACHE_TTL: "120"
      #HLS_SEGMENT_CACHE_MAX: "512"
      HLS_SEGMENT_CACHE_TTL: "900"
      HLS_SEGMENT_CACHE_MAX: "4096"
    volumes:
      - /opt/jellyfin-data/iptv:/iptv
      - /opt/jellyfin-data/filmon-iptv-data:/data
    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: filmon-iptv
        splunk-verify-connection: "false"
        splunk-format: json
        tag: filmon-iptv