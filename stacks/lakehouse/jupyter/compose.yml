services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile

    image: lakehouse-jupyter:latest

    container_name: lakehouse-jupyter
    hostname: jupyter
    restart: unless-stopped

    env_file:
      - .env

    environment:
      JUPYTER_ENABLE_LAB: "yes"
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      SPARK_MASTER: spark://spark:7077

    ports:
      - "8888:8888"

    volumes:
      - /opt/lakehouse-data/jupyter:/home/jovyan/work
      - ./jupyter_server_config.py:/home/jovyan/.jupyter/jupyter_server_config.py:ro
      - ./notebooks:/home/jovyan/work/notebooks:ro

    command:
      - start-notebook.py
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.port=8888
      - --ServerApp.open_browser=False

    networks:
      - lakehouse

networks:
  lakehouse:
    external: true
    name: lakehouse