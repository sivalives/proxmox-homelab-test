services:
  jupyter:
    image: quay.io/jupyter/pyspark-notebook:latest
    container_name: lakehouse-jupyter
    hostname: jupyter
    restart: unless-stopped

    env_file:
      - .env

    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ""
      JUPYTER_PASSWORD_HASH: ${JUPYTER_PASSWORD_HASH}

      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1

    ports:
      - "8888:8888"

    volumes:
      - /opt/lakehouse-data/jupyter:/home/jovyan/work

    command:
      - start-notebook.py
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.port=8888