services:

  minio-s3:
    image: minio/minio:latest
    container_name: lakehouse-minio
    hostname: minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    env_file:
      - .env

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - /opt/lakehouse-data/minio:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5