services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: lakehouse-rustfs
    hostname: rustfs
    restart: unless-stopped

    env_file:
      - .env

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - /opt/lakehouse-data/rustfs:/data

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s