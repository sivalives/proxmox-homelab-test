services:

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: lakehouse-spark:4.2.0-python3.13
    container_name: lakehouse-spark-master
    hostname: spark
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - /opt/lakehouse-data/spark:/opt/spark/work

    networks:
      - lakehouse

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: lakehouse-spark:4.2.0-python3.13
    container_name: lakehouse-spark-worker
    hostname: spark-worker
    restart: unless-stopped

    environment:
      PYSPARK_PYTHON: /usr/bin/python3.13

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark:7077

    depends_on:
      - spark-master

    volumes:
      - /opt/lakehouse-data/spark:/opt/spark/work

    networks:
      - lakehouse

networks:
  lakehouse:
    external: true
    name: lakehouse