services:
  spark:
    image: spark:4.2.0-python3
    container_name: lakehouse-spark
    hostname: spark
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - /opt/lakehouse-data/spark:/opt/spark/work

networks:
  lakehouse:
    name: lakehouse