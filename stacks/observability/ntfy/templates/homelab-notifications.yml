title: |
  {{- $alert := index .alerts 0 -}}
  {{- if eq .status "resolved" -}}
  ✅ RECOVERED
  {{- else if eq $alert.labels.severity "critical" -}}
  🚨 {{ $alert.annotations.summary }}
  {{- else if eq $alert.labels.severity "warning" -}}
  ⚠️ {{ $alert.annotations.summary }}
  {{- else -}}
  ℹ️ {{ $alert.annotations.summary }}
  {{- end }}

message: |
  {{- $alert := index .alerts 0 -}}
  {{- if $alert.labels.id }}
  LXC {{ $alert.labels.id | trimPrefix "lxc/" }} - {{ $alert.labels.name | upper }}
  {{- end }}

  Alert: {{ $alert.labels.alertname }}
  Time: {{ date "02 Jan 2006 15:04:05 MST" $alert.startsAt }} IST

  {{ $alert.annotations.description }}

priority: |
  {{- $alert := index .alerts 0 -}}
  {{- if eq .status "resolved" -}}
  3
  {{- else if eq $alert.labels.severity "critical" -}}
  5
  {{- else if eq $alert.labels.severity "warning" -}}
  4
  {{- else -}}
  3
  {{- end }}