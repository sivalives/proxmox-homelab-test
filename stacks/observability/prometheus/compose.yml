services:
  proxmox-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: proxmox-exporter
    restart: unless-stopped
    networks:
      - monitoring
    ports:
      - "9221:9221"
    environment:
      PVE_USER: "${PVE_USER}"
      PVE_TOKEN_NAME: "${PVE_TOKEN_NAME}"
      PVE_TOKEN_VALUE: "${PVE_TOKEN_VALUE}"
      PVE_VERIFY_SSL: "false"
    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: proxmox-exporter
        splunk-verify-connection: "false"
        splunk-format: json
        tag: proxmox-exporter

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    networks:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./config:/etc/prometheus:ro
      - /opt/observability-data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    depends_on:
      - proxmox-exporter
    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: prometheus
        splunk-verify-connection: "false"
        splunk-format: json
        tag: prometheus

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    networks:
      - monitoring
    ports:
      - "9093:9093"
    volumes:
      - ./config:/etc/alertmanager:ro
      - /opt/observability-data/alertmanager:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      - prometheus
    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: alertmanager
        splunk-verify-connection: "false"
        splunk-format: json
        tag: alertmanager
  
networks:
  monitoring:
    name: homelab-observability
    driver: bridge