# Prometheus alert rules
# Location: /opt/homelab/stacks/observability/config/rules.yml

groups:

  # ============================================================
  # PROXMOX
  # ============================================================
  - name: proxmox_alerts
    interval: 60s
    rules:

      # ----------------------------------------------------------
      # LXC disk usage > 80%
      # ----------------------------------------------------------
      - alert: ProxmoxLXCDiskHigh
        expr: |
          (
            (
              pve_disk_usage_bytes{id=~"lxc/.*"}
              / pve_disk_size_bytes{id=~"lxc/.*"}
            ) * 100
          )
          * on(id) group_left(name,node,type)
            pve_guest_info{type="lxc"}
          > 80
        for: 5m
        labels:
          severity: warning
          service: proxmox
          component: storage
        annotations:
          summary: "DISK HIGH"
          description: "LXC {{ $labels.id }} - {{ $labels.name }} is using {{ $value | humanize }}% disk space."

      # ----------------------------------------------------------
      # LXC disk usage > 90%
      # ----------------------------------------------------------
      - alert: ProxmoxLXCDiskCritical
        expr: |
          (
            (
              pve_disk_usage_bytes{id=~"lxc/.*"}
              / pve_disk_size_bytes{id=~"lxc/.*"}
            ) * 100
          )
          * on(id) group_left(name,node,type)
            pve_guest_info{type="lxc"}
          > 90
        for: 2m
        labels:
          severity: critical
          service: proxmox
          component: storage
        annotations:
          summary: "DISK CRITICAL"
          description: "LXC {{ $labels.id }} - {{ $labels.name }} is using {{ $value | humanize }}% disk space."

      # ----------------------------------------------------------
      # Physical Proxmox node down
      # ----------------------------------------------------------
      - alert: ProxmoxNodeDown
        expr: |
          pve_up{id="node/proxmox"} == 0
        for: 10s
        labels:
          severity: critical
          service: proxmox
          component: node
        annotations:
          summary: "NODE DOWN"
          description: "Proxmox node is not responding."

      # ----------------------------------------------------------
      # Individual LXC down
      # ----------------------------------------------------------
      - alert: ProxmoxLXCDown
        expr: |
          (
            pve_up{id=~"lxc/.*"} == 0
          )
          * on(id) group_left(name,node,type)
            pve_guest_info{type="lxc"}
        for: 10s
        labels:
          severity: critical
          service: proxmox
          component: lxc
        annotations:
          summary: "DOWN"
          description: "LXC {{ $labels.id }} - {{ $labels.name }} is down on Proxmox."

      # ----------------------------------------------------------
      # LXC / VM memory > 85%
      # ----------------------------------------------------------
      - alert: ProxmoxMemoryHigh
        expr: |
          (
            pve_memory_usage_bytes{id=~"(lxc|qemu)/.*"}
            / pve_memory_limit_bytes{id=~"(lxc|qemu)/.*"}
          ) * 100 > 85
        for: 10m
        labels:
          severity: warning
          service: proxmox
          component: memory
        annotations:
          summary: "MEMORY HIGH"
          description: "{{ $labels.id }} is using {{ $value | humanize }}% of allocated memory."

      # ----------------------------------------------------------
      # LXC restart detection
      #
      # Kept intentionally for testing.
      # A restart causes container uptime to drop.
      # ----------------------------------------------------------
      - alert: ProxmoxContainerRestart
        expr: |
          rate(pve_container_uptime_seconds[5m]) < 0
        for: 1m
        labels:
          severity: warning
          service: proxmox
          component: container
        annotations:
          summary: "CONTAINER RESTARTED"
          description: "Container {{ $labels.id }} has restarted because its uptime decreased."


  # ============================================================
  # PROMETHEUS / SYSTEM
  # ============================================================
  - name: system_alerts
    interval: 30s
    rules:

      # ----------------------------------------------------------
      # Any Prometheus scrape target unavailable
      # ----------------------------------------------------------
      - alert: PrometheusScrapeFailed
        expr: |
          up == 0
        for: 5m
        labels:
          severity: warning
          service: prometheus
          component: scrape
        annotations:
          summary: "SCRAPE FAILED"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}."


  # ============================================================
  # ALERTMANAGER
  # ============================================================
  - name: alertmanager_alerts
    interval: 30s
    rules:

      # ----------------------------------------------------------
      # Alertmanager unavailable
      # ----------------------------------------------------------
      - alert: AlertManagerDown
        expr: |
          up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
          service: alertmanager
          component: service
        annotations:
          summary: "DOWN"
          description: "Alertmanager is not responding."

      # ----------------------------------------------------------
      # Alertmanager notification delivery failures
      # ----------------------------------------------------------
      - alert: AlertManagerNotificationFailures
        expr: |
          rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
          service: alertmanager
          component: notification
        annotations:
          summary: "NOTIFICATION FAILURE"
          description: "Alertmanager is failing to deliver notifications to {{ $labels.receiver }}."