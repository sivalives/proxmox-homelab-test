# Prometheus alert rules
# Location: /opt/homelab/stacks/observability/config/rules.yml

groups:

  # ============================================================
  # PROXMOX
  # ============================================================
  - name: proxmox_alerts
    interval: 60s
    rules:

      # ----------------------------------------------------------
      # LXC disk usage > 80%
      # ----------------------------------------------------------
      - alert: ProxmoxLXCDiskHigh
        expr: |
          (
            (
              pve_disk_usage_bytes{id=~"lxc/.*"}
              / pve_disk_size_bytes{id=~"lxc/.*"}
            ) * 100
          )
          * on(id) group_left(name,node,type)
            pve_guest_info{type="lxc"}
          > 80
        for: 5m
        labels:
          severity: warning
          service: proxmox
          component: storage
        annotations:
          summary: "DISK HIGH"
          description: "LXC {{ $labels.id }} - {{ $labels.name }} is using {{ $value | humanize }}% disk space."

      # ----------------------------------------------------------
      # LXC disk usage > 90%
      # ----------------------------------------------------------
      - alert: ProxmoxLXCDiskCritical
        expr: |
          (
            (
              pve_disk_usage_bytes{id=~"lxc/.*"}
              / pve_disk_size_bytes{id=~"lxc/.*"}
            ) * 100
          )
          * on(id) group_left(name,node,type)
            pve_guest_info{type="lxc"}
          > 90
        for: 2m
        labels:
          severity: critical
          service: proxmox
          component: storage
        annotations:
          summary: "DISK CRITICAL"
          description: "LXC {{ $labels.id }} - {{ $labels.name }} is using {{ $value | humanize }}% disk space."

      # ----------------------------------------------------------
      # Physical Proxmox node down
      # ----------------------------------------------------------
      - alert: ProxmoxNodeDown
        expr: |
          pve_up{id="node/proxmox"} == 0
        for: 10s
        labels:
          severity: critical
          service: proxmox
          component: node
        annotations:
          summary: "NODE DOWN"
          description: "Proxmox node is not responding."

      # ----------------------------------------------------------
      # Individual LXC down
      # ----------------------------------------------------------
      - alert: ProxmoxLXCDown
        expr: |
          (
            pve_up{id=~"lxc/.*"} == 0
          )
          * on(id) group_left(name,node,type)
            pve_guest_info{type="lxc"}
        for: 10s
        labels:
          severity: critical
          service: proxmox
          component: lxc
        annotations:
          summary: "DOWN"
          description: "LXC {{ $labels.id }} - {{ $labels.name }} is down on Proxmox."

      # ----------------------------------------------------------
      # LXC / VM memory > 85%
      # ----------------------------------------------------------
      - alert: ProxmoxMemoryHigh
        expr: |
          (
            pve_memory_usage_bytes{id=~"(lxc|qemu)/.*"}
            / pve_memory_limit_bytes{id=~"(lxc|qemu)/.*"}
          ) * 100 > 85
        for: 10m
        labels:
          severity: warning
          service: proxmox
          component: memory
        annotations:
          summary: "MEMORY HIGH"
          description: "{{ $labels.id }} is using {{ $value | humanize }}% of allocated memory."

      # ----------------------------------------------------------
      # LXC restart detection
      #
      # Kept intentionally for testing.
      # A restart causes container uptime to drop.
      # ----------------------------------------------------------
      - alert: ProxmoxContainerRestart
        expr: |
          rate(pve_container_uptime_seconds[5m]) < 0
        for: 1m
        labels:
          severity: warning
          service: proxmox
          component: container
        annotations:
          summary: "CONTAINER RESTARTED"
          description: "Container {{ $labels.id }} has restarted because its uptime decreased."


  # ============================================================
  # PROMETHEUS / SYSTEM
  # ============================================================
  - name: system_alerts
    interval: 30s
    rules:

      # ----------------------------------------------------------
      # Any Prometheus scrape target unavailable
      # ----------------------------------------------------------
      - alert: PrometheusScrapeFailed
        expr: |
          up == 0
        for: 5m
        labels:
          severity: warning
          service: prometheus
          component: scrape
        annotations:
          summary: "SCRAPE FAILED"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}."


  # ============================================================
  # ALERTMANAGER
  # ============================================================
  - name: alertmanager_alerts
    interval: 30s
    rules:

      # ----------------------------------------------------------
      # Alertmanager unavailable
      # ----------------------------------------------------------
      - alert: AlertManagerDown
        expr: |
          up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
          service: alertmanager
          component: service
        annotations:
          summary: "DOWN"
          description: "Alertmanager is not responding."

      # ----------------------------------------------------------
      # Alertmanager notification delivery failures
      # ----------------------------------------------------------
      - alert: AlertManagerNotificationFailures
        expr: |
          rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
          service: alertmanager
          component: notification
        annotations:
          summary: "NOTIFICATION FAILURE"
          description: "Alertmanager is failing to deliver notifications to {{ $labels.receiver }}."


  # ============================================================
  # DOCKER
  # ============================================================
  - name: docker_alerts
    interval: 30s
    rules:

      # ----------------------------------------------------------
      # Docker exporter unavailable
      # ----------------------------------------------------------
      - alert: DockerExporterDown
        expr: |
          up{job="docker"} == 0
        for: 2m
        labels:
          severity: critical
          service: docker
          component: exporter
        annotations:
          summary: "DOCKER EXPORTER DOWN"
          description: "Docker exporter is not responding on LXC {{ $labels.lxc }}."

      # ----------------------------------------------------------
      # Docker daemon unreachable
      # ----------------------------------------------------------
      - alert: DockerDaemonUnreachable
        expr: |
          docker_exporter_up{job="docker"} == 0
        for: 2m
        labels:
          severity: critical
          service: docker
          component: daemon
        annotations:
          summary: "DOCKER DOWN"
          description: "Docker exporter cannot reach the Docker daemon on LXC {{ $labels.lxc }}."

      # ----------------------------------------------------------
      # Docker container stopped / exited
      # ----------------------------------------------------------
      - alert: DockerContainerExited
        expr: |
          container_state{
            job="docker",
            name!="docker-exporter"
          } == 0
        for: 2m
        labels:
          severity: critical
          service: docker
          component: container
        annotations:
          summary: "CONTAINER DOWN"
          description: "Container {{ $labels.name }} on LXC {{ $labels.lxc }} is no longer running."

      # ----------------------------------------------------------
      # Docker container restarting / flapping
      #
      # More than 2 start-time changes in 10 minutes.
      # ----------------------------------------------------------
      - alert: DockerContainerRestarting
        expr: |
          changes(
            container_start_time_seconds{
              job="docker",
              name!="docker-exporter"
            }[10m]
          ) > 2
        for: 1m
        labels:
          severity: critical
          service: docker
          component: container
        annotations:
          summary: "CONTAINER RESTARTING"
          description: "Container {{ $labels.name }} on LXC {{ $labels.lxc }} has restarted more than twice in the last 10 minutes."

      # ----------------------------------------------------------
      # Docker healthcheck failed
      # ----------------------------------------------------------
      - alert: DockerContainerUnhealthy
        expr: |
          container_health_status{
            job="docker",
            name!="docker-exporter"
          } == 0
        for: 2m
        labels:
          severity: critical
          service: docker
          component: health
        annotations:
          summary: "CONTAINER UNHEALTHY"
          description: "Container {{ $labels.name }} on LXC {{ $labels.lxc }} has been unhealthy for more than 2 minutes."

      # ----------------------------------------------------------
      # Docker container CPU > 80% of one CPU
      # ----------------------------------------------------------
      - alert: DockerContainerCPUHigh
        expr: |
          rate(
            container_cpu_usage_seconds_total{
              job="docker",
              name!="docker-exporter"
            }[5m]
          ) > 0.8
        for: 10m
        labels:
          severity: warning
          service: docker
          component: cpu
        annotations:
          summary: "CONTAINER CPU HIGH"
          description: "Container {{ $labels.name }} on LXC {{ $labels.lxc }} is using more than 80% of one CPU core for 10 minutes."

      # ----------------------------------------------------------
      # Docker container CPU > 150% of one CPU
      # ----------------------------------------------------------
      - alert: DockerContainerCPUCritical
        expr: |
          rate(
            container_cpu_usage_seconds_total{
              job="docker",
              name!="docker-exporter"
            }[5m]
          ) > 1.5
        for: 10m
        labels:
          severity: critical
          service: docker
          component: cpu
        annotations:
          summary: "CONTAINER CPU CRITICAL"
          description: "Container {{ $labels.name }} on LXC {{ $labels.lxc }} is using more than 1.5 CPU cores for 10 minutes."

      # ----------------------------------------------------------
      # Docker container memory > 80%
      #
      # Ignore containers without a memory limit.
      # ----------------------------------------------------------
      - alert: DockerContainerMemoryHigh
        expr: |
          (
            container_memory_working_set_bytes{
              job="docker",
              name!="docker-exporter"
            }
            /
            container_memory_limit_bytes{
              job="docker",
              name!="docker-exporter"
            }
          ) > 0.80
          and
          container_memory_limit_bytes{
            job="docker",
            name!="docker-exporter"
          } > 0
        for: 10m
        labels:
          severity: warning
          service: docker
          component: memory
        annotations:
          summary: "CONTAINER MEMORY HIGH"
          description: "Container {{ $labels.name }} on LXC {{ $labels.lxc }} is using more than 80% of its memory limit."

      # ----------------------------------------------------------
      # Docker container memory > 95%
      #
      # Ignore containers without a memory limit.
      # ----------------------------------------------------------
      - alert: DockerContainerMemoryCritical
        expr: |
          (
            container_memory_working_set_bytes{
              job="docker",
              name!="docker-exporter"
            }
            /
            container_memory_limit_bytes{
              job="docker",
              name!="docker-exporter"
            }
          ) > 0.95
          and
          container_memory_limit_bytes{
            job="docker",
            name!="docker-exporter"
          } > 0
        for: 5m
        labels:
          severity: critical
          service: docker
          component: memory
        annotations:
          summary: "CONTAINER MEMORY CRITICAL"
          description: "Container {{ $labels.name }} on LXC {{ $labels.lxc }} is using more than 95% of its memory limit."