services:
  pihole:
    image: pihole/pihole:latest
    network_mode: host
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      FTLCONF_webserver_api_password: ${WEBPASSWORD}
      FTLCONF_dns_upstreams: ${PIHOLE_DNS}
      DNSSEC: "true"
      QUERY_LOGGING: "true"
      WEBTHEME: default-dark
      VIRTUAL_HOST: pihole.local
      FTLCONF_dns_hosts: |
        192.168.1.106 pihole.lan
        192.168.1.106 splunk.lan
        192.168.1.106 vaultwarden.lan
        192.168.1.106 rabbitmq.lan
        192.168.1.106 npm.lan
        192.168.1.106 immich.lan
        192.168.1.106 openbao.lan
        192.168.1.106 jellyfin.lan
        192.168.1.106 docker.lan
        192.168.1.106 homepage.lan
        192.168.1.106 ntfy.lan
        192.168.1.106 proxmox.lan
    volumes:
      - /opt/pihole-data:/etc/pihole
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    logging:
      driver: splunk
      options:
        splunk-url: ${SPLUNK_HEC_URL}
        splunk-token: ${SPLUNK_HEC_TOKEN}
        splunk-index: docker_logs
        splunk-sourcetype: pihole
        splunk-verify-connection: "false"
        splunk-format: json
        tag: pihole