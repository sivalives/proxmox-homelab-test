# =================================================================
# indexes.conf
# Splunk Index Configuration
# Location: config/splunk/indexes.conf
# IN GIT -- safe to commit
# =================================================================

# -----------------------------------------------------------------
# DEFAULT settings applied to all indexes
# -----------------------------------------------------------------
[default]
maxTotalDataSizeMB  = 10240        # 10GB max total across all indexes
frozenTimePeriodInSecs = 7776000   # 90 days retention

# -----------------------------------------------------------------
# DOCKER CONTAINER LOGS
# From: all LXC containers via Docker logging driver
# -----------------------------------------------------------------
[docker_logs]
homePath   = $SPLUNK_DB/docker_logs/db
coldPath   = $SPLUNK_DB/docker_logs/colddb
thawedPath = $SPLUNK_DB/docker_logs/thaweddb
maxDataSize = 1024                 # 1GB max
frozenTimePeriodInSecs = 2592000   # 30 days

[docker_errors]
homePath   = $SPLUNK_DB/docker_errors/db
coldPath   = $SPLUNK_DB/docker_errors/colddb
thawedPath = $SPLUNK_DB/docker_errors/thaweddb
maxDataSize = 512                  # 512MB max
frozenTimePeriodInSecs = 7776000   # 90 days — keep errors longer

[docker_health]
homePath   = $SPLUNK_DB/docker_health/db
coldPath   = $SPLUNK_DB/docker_health/colddb
thawedPath = $SPLUNK_DB/docker_health/thaweddb
maxDataSize = 256                  # 256MB max
frozenTimePeriodInSecs = 2592000   # 30 days

[docker_actions]
homePath   = $SPLUNK_DB/docker_actions/db
coldPath   = $SPLUNK_DB/docker_actions/colddb
thawedPath = $SPLUNK_DB/docker_actions/thaweddb
maxDataSize = 512                  # 512MB max
frozenTimePeriodInSecs = 7776000   # 90 days

[docker_system]
homePath   = $SPLUNK_DB/docker_system/db
coldPath   = $SPLUNK_DB/docker_system/colddb
thawedPath = $SPLUNK_DB/docker_system/thaweddb
maxDataSize = 512                  # 512MB max
frozenTimePeriodInSecs = 2592000   # 30 days

# -----------------------------------------------------------------
# IOT / HOMELAB
# From: Telegram bot, MQTT, ESP32, automation events
# -----------------------------------------------------------------
[iot_sensors]
homePath   = $SPLUNK_DB/iot_sensors/db
coldPath   = $SPLUNK_DB/iot_sensors/colddb
thawedPath = $SPLUNK_DB/iot_sensors/thaweddb
maxDataSize = 1024                 # 1GB max
frozenTimePeriodInSecs = 7776000   # 90 days

[iot_actions]
homePath   = $SPLUNK_DB/iot_actions/db
coldPath   = $SPLUNK_DB/iot_actions/colddb
thawedPath = $SPLUNK_DB/iot_actions/thaweddb
maxDataSize = 512                  # 512MB max
frozenTimePeriodInSecs = 7776000   # 90 days

[iot_devices]
homePath   = $SPLUNK_DB/iot_devices/db
coldPath   = $SPLUNK_DB/iot_devices/colddb
thawedPath = $SPLUNK_DB/iot_devices/thaweddb
maxDataSize = 256                  # 256MB max
frozenTimePeriodInSecs = 7776000   # 90 days

# -----------------------------------------------------------------
# SYSTEM / INFRASTRUCTURE
# From: Proxmox, Pi-hole, Uptime Kuma
# -----------------------------------------------------------------
[system]
homePath   = $SPLUNK_DB/system/db
coldPath   = $SPLUNK_DB/system/colddb
thawedPath = $SPLUNK_DB/system/thaweddb
maxDataSize = 512                  # 512MB max
frozenTimePeriodInSecs = 2592000   # 30 days
