# =================================================================
# limits.conf
# Splunk Resource Limits
# Location: config/splunk/limits.conf
# IN GIT -- safe to commit
# Tuned for 4GB RAM LXC
# =================================================================

[thruput]
maxKBps = 256                      # Limit ingestion speed

[kvstore]
max_size_mb = 512                  # KVStore max 512MB

[search]
max_searches_per_cpu = 1           # Limit concurrent searches
base_max_searches    = 2
max_rt_search_multiplier = 1

[indexing]
maxKBps = 256
