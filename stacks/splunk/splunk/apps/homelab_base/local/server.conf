# =================================================================
# server.conf
# Splunk Server Configuration
# Location: config/splunk/server.conf
# IN GIT -- safe to commit
# =================================================================

[general]
serverName = splunk-homelab
timezone   = Asia/Kolkata

[license]
active_group = Free

# -----------------------------------------------------------------
# KVSTORE -- reduce memory usage for free tier
# -----------------------------------------------------------------
[kvstore]
disabled = false
port     = 8191

# -----------------------------------------------------------------
# SSL -- disabled for homelab internal use
# -----------------------------------------------------------------
[sslConfig]
enableSplunkdSSL = false
